<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Страница предмета</title>

<style>
* {
box-sizing: border-box;
}

html,
body {
margin: 0;
padding: 0;
background: #000;
color: #fff;
font-family: Arial, Helvetica, sans-serif;
}

body {
min-height: 100vh;
}

.page {
width: 100%;
max-width: 1300px;
margin: 0 auto;
padding: 50px 30px 100px;
text-align: center;
}


/* ФОТОГАЛЕРЕЯ */

.gallery {
position: relative;
width: 100%;

display: flex;
justify-content: center;
align-items: center;

margin-bottom: 20px;
}

.photo-container {
width: min(1000px, 90vw);
height: min(700px, 72vh);

display: flex;
align-items: center;
justify-content: center;

overflow: hidden;
}

.photo-container img {
max-width: 100%;
max-height: 100%;

width: auto;
height: auto;

object-fit: contain;
display: block;
}


/* СТРЕЛКИ */

.arrow {
position: absolute;

top: 50%;
transform: translateY(-50%);

width: 52px;
height: 52px;

border: none;
border-radius: 50%;

background: rgba(255, 255, 255, 0.08);
color: #fff;

font-size: 32px;
line-height: 52px;

cursor: pointer;

transition: background 0.2s ease;
}

.arrow:hover {
background: rgba(255, 255, 255, 0.2);
}

.arrow-left {
left: 10px;
}

.arrow-right {
right: 10px;
}


/* СЧЁТЧИК */

.photo-counter {
margin: 15px 0 50px;

color: #777;

font-size: 13px;
}


/* ИНФОРМАЦИЯ */

.content {
max-width: 800px;
margin: 0 auto;
}

.number {
color: #777;

font-size: 14px;

margin-bottom: 12px;
}

h1 {
margin: 0 0 35px;

font-size: clamp(26px, 4vw, 44px);

font-weight: 400;

line-height: 1.15;
}

.description {
max-width: 700px;

margin: 0 auto 60px;

font-size: 17px;
line-height: 1.7;

color: #ddd;

padding: 0 20px;
}


/* ЭКСПЕРТИЗА */

.expertise {
width: 100%;

max-width: 1150px;

margin: 0 auto;

padding-top: 40px;

border-top: 1px solid #222;
}

.expertise-title {
margin-bottom: 25px;

font-size: 13px;

letter-spacing: 0.12em;

text-transform: uppercase;

color: #777;
}

.expertise-viewer {
width: 100%;

height: 1000px;

border: none;

background: #fff;

display: block;
}

.expertise-download {
display: inline-block;

margin-top: 20px;

padding: 12px 24px;

border: 1px solid #444;

color: #fff;

text-decoration: none;

transition: background 0.2s ease,
color 0.2s ease;
}

.expertise-download:hover {
background: #fff;
color: #000;
}


/* СКРЫТЫЕ ЭЛЕМЕНТЫ */

.hidden {
display: none;
}


/* ТЕЛЕФОН */

@media (max-width: 600px) {

.page {
padding: 25px 15px 60px;
}

.photo-container {
width: 100%;
height: 60vh;
}

.arrow {
width: 42px;
height: 42px;

font-size: 25px;
line-height: 42px;
}

.arrow-left {
left: 0;
}

.arrow-right {
right: 0;
}

h1 {
margin-bottom: 25px;
}

.description {
font-size: 16px;

line-height: 1.65;

padding: 0 10px;

margin-bottom: 45px;
}

.expertise {
width: 100%;
}

.expertise-viewer {
height: 700px;
}

}

</style>
</head>


<body>

<div class="page">


<!-- ФОТОГАЛЕРЕЯ -->

<div
class="gallery"
id="gallery">

<button
class="arrow arrow-left"
id="prev">

‹

</button>


<div class="photo-container">

<img
id="photo"
src=""
alt="">

</div>


<button
class="arrow arrow-right"
id="next">

›

</button>

</div>


<!-- НОМЕР ФОТО -->

<div
class="photo-counter"
id="counter">
</div>


<!-- ИНФОРМАЦИЯ О ПРЕДМЕТЕ -->

<main class="content">


<div
class="number"
id="number">
</div>


<h1 id="title"></h1>


<div
class="description"
id="description">
</div>


</main>


<!-- ЭКСПЕРТИЗА -->

<div
class="expertise hidden"
id="expertise">


<div class="expertise-title">

Экспертное заключение

</div>


<iframe
id="expertise-viewer"
src="">
</iframe>


<a
id="expertise-download"
class="expertise-download"
href=""
download>

Скачать экспертное заключение

</a>


</div>


</div>


<script>


/*
* ПОЛУЧАЕМ НОМЕР ПРЕДМЕТА
*
* Например:
*
* item.html?object=001
*/

const params =
new URLSearchParams(
window.location.search
);


const objectId =
params.get("object");


let photos = [];

let currentPhoto = 0;

let objectFolder = "";


/*
* ЗАГРУЗКА ПРЕДМЕТА
*/

async function loadObject() {


if (!objectId) {

document.getElementById("title").textContent =
"Предмет не указан";

return;

}


try {


/*
* 1. Загружаем catalog.json
*/

const catalogResponse =
await fetch("catalog.json");


if (!catalogResponse.ok) {

throw new Error(
"Не удалось загрузить catalog.json"
);

}


const catalog =
await catalogResponse.json();


/*
* 2. Находим папку предмета
*/

objectFolder =
catalog[objectId];


if (!objectFolder) {

throw new Error(
"Предмет не найден в catalog.json"
);

}


/*
* 3. Загружаем info.json
*/

const infoResponse =
await fetch(
`objects/${objectFolder}/info.json`
);


if (!infoResponse.ok) {

throw new Error(
"Не удалось загрузить info.json"
);

}


const data =
await infoResponse.json();


/*
* 4. НАЗВАНИЕ ВКЛАДКИ
*/

document.title =
data.title ||
"Страница предмета";


/*
* 5. НОМЕР ПРЕДМЕТА
*/

document.getElementById("number").textContent =
data.catalognumber
? `№ ${data.catalognumber}`
: "";


/*
* 6. НАЗВАНИЕ
*/

document.getElementById("title").textContent =
data.title || "";


/*
* 7. ОПИСАНИЕ
*/

document.getElementById("description").textContent =
data.description || "";


/*
* 8. ФОТОГРАФИИ
*/

photos =
data.photos || [];


if (photos.length > 0) {


showPhoto(0);


/*
* Если фотография одна —
* стрелки не нужны
*/

if (photos.length === 1) {

document.getElementById("prev")
.style.display = "none";

document.getElementById("next")
.style.display = "none";

}

} else {


/*
* Нет фотографий —
* скрываем галерею
*/

document.getElementById("gallery")
.classList.add("hidden");


document.getElementById("counter")
.classList.add("hidden");

}


/*
* 9. ЭКСПЕРТИЗА
*/

if (data.expertise) {


const expertise =
document.getElementById("expertise");


const viewer =
document.getElementById(
"expertise-viewer"
);


const download =
document.getElementById(
"expertise-download"
);


/*
* Путь к PDF
*/

const file =
`objects/${objectFolder}/${data.expertise}`;


/*
* Показываем PDF
* прямо на странице
*/

viewer.src = file;


/*
* Ссылка на скачивание
*/

download.href = file;


/*
* Показываем блок
*/

expertise.classList.remove(
"hidden"
);

}


}

catch (error) {


console.error(error);


document.getElementById("title").textContent =
"Не удалось загрузить предмет.";

}

}


/*
* ПОКАЗ ФОТО
*/

function showPhoto(index) {


if (photos.length === 0) {
return;
}


currentPhoto = index;


const photo =
document.getElementById("photo");


photo.src =
`objects/${objectFolder}/${photos[currentPhoto]}`;


photo.alt =
document.getElementById("title")
.textContent;


document.getElementById("counter")
.textContent =
`${currentPhoto + 1} / ${photos.length}`;

}


/*
* ЛЕВАЯ СТРЕЛКА
*/

document.getElementById("prev")
.addEventListener(
"click",
() => {


if (photos.length === 0) {
return;
}


let next =
currentPhoto - 1;


if (next < 0) {

next =
photos.length - 1;

}


showPhoto(next);

}
);


/*
* ПРАВАЯ СТРЕЛКА
*/

document.getElementById("next")
.addEventListener(
"click",
() => {


if (photos.length === 0) {
return;
}


let next =
currentPhoto + 1;


if (next >= photos.length) {

next = 0;

}


showPhoto(next);

}
);


/*
* ЗАПУСК
*/

loadObject();

</script>

</body>
</html>
