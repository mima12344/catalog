<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}


/* ОСНОВНАЯ СТРАНИЦА */

.page {
    width: 100%;
    max-width: 1000px;

    margin: 0 auto;

    padding: 60px 30px 100px;
}


/* ВВОДНАЯ ИНФОРМАЦИЯ */

.introduction {
    min-height: 320px;

    /*
     * Здесь позже можно разместить
     * приветствие и вводный текст.
     */

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}


/*
 * Пустой контейнер для будущего текста.
 * Сейчас ничего не отображает.
 */

.introduction-content {
    width: 100%;
    max-width: 750px;
}


/* КАТАЛОГ */

.catalog {
    width: 100%;

    padding-top: 30px;
}


.catalog-title {
    margin: 0 0 60px;

    text-align: center;

    font-size: clamp(28px, 4vw, 44px);

    font-weight: 400;

    line-height: 1.2;
}


/* СПИСОК КАТЕГОРИЙ */

.categories {
    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* КАТЕГОРИЯ */

.category {
    width: 100%;
    max-width: 700px;

    margin-bottom: 38px;

    text-align: center;
}


/* НАЗВАНИЕ КАТЕГОРИИ */

.category-link {
    display: inline-block;

    color: #fff;

    text-decoration: none;

    font-size: 25px;

    line-height: 1.3;

    font-weight: 400;

    transition:
        opacity 0.2s ease;
}

.category-link:hover {
    opacity: 0.6;
}


/* ПОДКАТЕГОРИИ */

.subcategories {
    margin-top: 12px;

    margin-left: 55px;

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    text-align: left;
}


.subcategory-link {
    position: relative;

    display: inline-block;

    padding: 4px 0;

    color: #777;

    text-decoration: none;

    font-size: 16px;

    line-height: 1.4;

    transition:
        color 0.2s ease;
}


/*
 * Небольшая отметка перед подкатегорией
 */

.subcategory-link::before {
    content: "—";

    position: absolute;

    left: -22px;

    color: #444;
}


.subcategory-link:hover {
    color: #fff;
}


/* ЗАГРУЗКА */

.loading {
    color: #555;

    font-size: 14px;

    text-align: center;

    padding: 40px 0;
}


/* ОШИБКА */

.error {
    color: #777;

    font-size: 14px;

    text-align: center;

    padding: 40px 0;
}


/* МОБИЛЬНЫЕ */

@media (max-width: 600px) {

    .page {
        padding:
            30px 20px 70px;
    }


    .introduction {
        min-height: 240px;
    }


    .catalog {
        padding-top: 20px;
    }


    .catalog-title {
        margin-bottom: 45px;

        font-size: 30px;
    }


    .category {
        margin-bottom: 32px;
    }


    .category-link {
        font-size: 22px;
    }


    .subcategories {
        margin-left: 35px;

        margin-top: 10px;
    }


    .subcategory-link {
        font-size: 15px;
    }

}
</style>

</head>

<body>

<div class="page">


    <!--
        ПУСТОЕ МЕСТО ПОД ПРИВЕТСТВИЕ
        И ВВОДНУЮ ИНФОРМАЦИЮ

        Позже сюда можно будет добавить
        любой нужный текст.
    -->

    <section class="introduction">

        <div
            class="introduction-content"
            id="introduction-content">
        </div>

    </section>


    <!-- КАТАЛОГ -->

    <main class="catalog">

        <h1 class="catalog-title">
            Каталог
        </h1>


        <div
            class="categories"
            id="categories">

            <div class="loading">
                Загрузка...
            </div>

        </div>

    </main>

</div>


<script>

/*
 * Загружаем catalog.json
 */

async function loadCatalog() {

    const categoriesContainer =
        document.getElementById(
            "categories"
        );


    try {

        /*
         * Получаем список предметов
         */

        const catalogResponse =
            await fetch(
                "catalog.json"
            );


        if (!catalogResponse.ok) {

            throw new Error(
                "Не удалось загрузить catalog.json"
            );

        }


        const catalog =
            await catalogResponse.json();


        /*
         * catalog.json имеет вид:
         *
         * {
         *   "001": "01-катана-школы-о-с",
         *   "002": "02-другой-предмет"
         * }
         *
         */


        const objects =
            Object.entries(
                catalog
            );


        /*
         * Здесь будем собирать категории
         *
         * Структура:
         *
         * {
         *   "Катана": Set(["Японское оружие"]),
         *   "Доспехи": Set(["Самурайские доспехи"])
         * }
         */

        const categoryMap =
            new Map();


        /*
         * Загружаем info.json
         * каждого предмета
         */

        for (
            const [objectId, folder]
            of objects
        ) {

            try {

                const infoResponse =
                    await fetch(
                        `objects/${folder}/info.json`
                    );


                if (!infoResponse.ok) {

                    console.warn(
                        `Не удалось загрузить info.json предмета ${objectId}`
                    );

                    continue;

                }


                const data =
                    await infoResponse.json();


                /*
                 * Категория
                 */

                const category =
                    typeof data.category === "string"
                        ? data.category.trim()
                        : "";


                /*
                 * Подкатегория
                 */

                const subcategory =
                    typeof data.subcategory === "string"
                        ? data.subcategory.trim()
                        : "";


                /*
                 * Если категория отсутствует,
                 * пропускаем предмет
                 */

                if (!category) {
                    continue;
                }


                /*
                 * Если категории ещё нет —
                 * создаём её
                 */

                if (
                    !categoryMap.has(
                        category
                    )
                ) {

                    categoryMap.set(
                        category,
                        new Set()
                    );

                }


                /*
                 * Добавляем подкатегорию
                 */

                if (subcategory) {

                    categoryMap
                        .get(category)
                        .add(subcategory);

                }

            }

            catch (error) {

                console.error(
                    `Ошибка предмета ${objectId}:`,
                    error
                );

            }

        }


        /*
         * Если категорий нет
         */

        if (
            categoryMap.size === 0
        ) {

            categoriesContainer.innerHTML =
                `
                <div class="error">
                    Категории пока отсутствуют.
                </div>
                `;

            return;

        }


        /*
         * Сортировка категорий
         *
         * Русский алфавит
         */

        const sortedCategories =
            Array.from(
                categoryMap.entries()
            )
            .sort(
                ([categoryA], [categoryB]) =>
                    categoryA.localeCompare(
                        categoryB,
                        "ru",
                        {
                            sensitivity: "base"
                        }
                    )
            );


        /*
         * Очищаем "Загрузка..."
         */

        categoriesContainer.innerHTML =
            "";


        /*
         * Создаём категории
         */

        for (
            const [
                category,
                subcategories
            ]
            of sortedCategories
        ) {

            createCategory(
                category,
                subcategories,
                categoriesContainer
            );

        }

    }

    catch (error) {

        console.error(
            error
        );


        categoriesContainer.innerHTML =
            `
            <div class="error">
                Не удалось загрузить каталог.
            </div>
            `;

    }

}


/*
 * Создание категории
 */

function createCategory(
    category,
    subcategories,
    container
) {

    /*
     * Основной блок категории
     */

    const categoryElement =
        document.createElement(
            "section"
        );


    categoryElement.className =
        "category";


    /*
     * Ссылка категории
     */

    const categoryLink =
        document.createElement(
            "a"
        );


    categoryLink.className =
        "category-link";


    categoryLink.textContent =
        category;


    categoryLink.href =
        `category.html?category=${encodeURIComponent(
            category
        )}`;


    categoryElement.appendChild(
        categoryLink
    );


    /*
     * Сортируем подкатегории
     */

    const sortedSubcategories =
        Array.from(
            subcategories
        )
        .sort(
            (a, b) =>
                a.localeCompare(
                    b,
                    "ru",
                    {
                        sensitivity: "base"
                    }
                )
        );


    /*
     * Если есть подкатегории
     */

    if (
        sortedSubcategories.length > 0
    ) {

        const subcategoriesElement =
            document.createElement(
                "div"
            );


        subcategoriesElement.className =
            "subcategories";


        /*
         * Создаём каждую подкатегорию
         */

        for (
            const subcategory
            of sortedSubcategories
        ) {

            const subcategoryLink =
                document.createElement(
                    "a"
                );


            subcategoryLink.className =
                "subcategory-link";


            subcategoryLink.textContent =
                subcategory;


            /*
             * Пока подкатегория ведёт
             * на страницу категории
             * с фильтром подкатегории
             */

            subcategoryLink.href =
                `category.html?category=${encodeURIComponent(
                    category
                )}&subcategory=${encodeURIComponent(
                    subcategory
                )}`;


            subcategoriesElement.appendChild(
                subcategoryLink
            );

        }


        categoryElement.appendChild(
            subcategoriesElement
        );

    }


    /*
     * Добавляем категорию
     * в каталог
     */

    container.appendChild(
        categoryElement
    );

}


/*
 * Запуск
 */

loadCatalog();

</script>

</body>
</html>
