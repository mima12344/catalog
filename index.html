
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>katanagallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 30px 80px;
        }

        /* ЛОГОТИП */

        .introduction {
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .introduction img {
            display: block;
            width: 220px;
            max-width: 70%;
            max-height: 240px;
            object-fit: contain;
        }

        /* КАТАЛОГ */

        .catalog-section {
            width: 100%;
        }

        .catalog-heading {
            margin: 0 0 45px;
            text-align: center;
            font-size: 20px;
            font-weight: 400;
            color: #777;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 80px;
            row-gap: 38px;
        }

        .category {
            text-align: left;
        }

        .category-title {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            font-size: 23px;
            line-height: 1.3;
            font-weight: 400;
            transition: opacity 0.2s ease;
        }

        .category-title:hover {
            opacity: 0.65;
        }

        .subcategories {
            margin-top: 10px;
            margin-left: 45px;
        }

        .subcategory {
            display: block;
            position: relative;
            color: #777;
            text-decoration: none;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .subcategory::before {
            content: "—";
            position: absolute;
            left: -18px;
            color: #555;
        }

        .subcategory:hover {
            color: #fff;
        }

        /* ТЕЛЕФОН */

        @media (max-width: 650px) {
            .page {
                padding-left: 25px;
                padding-right: 25px;
            }

            .introduction {
                min-height: 220px;
            }

            .introduction img {
                width: 170px;
                max-height: 170px;
            }

            .categories {
                grid-template-columns: 1fr;
                row-gap: 35px;
            }

            .catalog-heading {
                margin-bottom: 35px;
            }

            .category-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ЛОГОТИП -->

    <section class="introduction">
        <img src="logo.jpg" alt="Логотип Katana Gallery">
    </section>

    <!-- КАТАЛОГ -->

    <section class="catalog-section">

        <h1 class="catalog-heading">
            Каталог
        </h1>

        <div
            id="categories"
            class="categories"
        ></div>

    </section>

</div>

<script>
    const catalogContainer =
        document.getElementById("categories");

    async function loadCatalog() {
        try {
            const catalogResponse =
                await fetch("catalog.json", {
                    cache: "no-store"
                });

            if (!catalogResponse.ok) {
                throw new Error(
                    "Не удалось загрузить catalog.json"
                );
            }

            const catalog =
                await catalogResponse.json();

            const categories = new Map();

            /*
             * Собираем категории
             * и подкатегории.
             */

            for (
                const [catalogNumber, folder]
                of Object.entries(catalog)
            ) {
                try {
                    const infoResponse =
                        await fetch(
                            `objects/${encodeURIComponent(folder)}/info.json`,
                            {
                                cache: "no-store"
                            }
                        );

                    if (!infoResponse.ok) {
                        continue;
                    }

                    const data =
                        await infoResponse.json();

                    const category = data.category;

                    if (!category) {
                        continue;
                    }

                    if (!categories.has(category)) {
                        categories.set(
                            category,
                            new Set()
                        );
                    }

                    if (data.subcategory) {
                        categories
                            .get(category)
                            .add(data.subcategory);
                    }

                } catch (error) {
                    console.error(
                        `Ошибка загрузки объекта ${catalogNumber}:`,
                        error
                    );
                }
            }

            /*
             * ВСЕ ПРЕДМЕТЫ
             */

            const allObjects =
                document.createElement("div");

            allObjects.className = "category";

            const allObjectsLink =
                document.createElement("a");

            allObjectsLink.className = "category-title";
            allObjectsLink.href = "category.html";
            allObjectsLink.textContent = "Все предметы";

            allObjects.appendChild(allObjectsLink);
            catalogContainer.appendChild(allObjects);

            /*
             * ОБЫЧНЫЕ КАТЕГОРИИ
             */

            const sortedCategories =
                [...categories.entries()].sort(
                    (a, b) =>
                        a[0].localeCompare(b[0], "ru")
                );

            for (
                const [category, subcategories]
                of sortedCategories
            ) {
                const categoryBlock =
                    document.createElement("div");

                categoryBlock.className = "category";

                const categoryLink =
                    document.createElement("a");

                categoryLink.className = "category-title";

                categoryLink.href =
                    `category.html?category=${encodeURIComponent(category)}`;

                categoryLink.textContent = category;

                categoryBlock.appendChild(categoryLink);

                const sortedSubcategories =
                    [...subcategories].sort(
                        (a, b) => a.localeCompare(b, "ru")
                    );

                if (sortedSubcategories.length > 0) {
                    const subcategoriesBlock =
                        document.createElement("div");

                    subcategoriesBlock.className = "subcategories";

                    for (
                        const subcategory
                        of sortedSubcategories
                    ) {
                        const subcategoryLink =
                            document.createElement("a");

                        subcategoryLink.className = "subcategory";

                        subcategoryLink.href =
                            `category.html?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(subcategory)}`;

                        subcategoryLink.textContent = subcategory;

                        subcategoriesBlock.appendChild(
                            subcategoryLink
                        );
                    }

                    categoryBlock.appendChild(
                        subcategoriesBlock
                    );
                }

                catalogContainer.appendChild(categoryBlock);
            }

        } catch (error) {
            console.error(
                "Ошибка загрузки каталога:",
                error
            );

            catalogContainer.innerHTML =
                "<p>Не удалось загрузить каталог.</p>";
        }
    }

    loadCatalog();
</script>

</body>
</html>
