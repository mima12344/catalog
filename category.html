<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Категория</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            min-height: 100vh;
        }


        .page {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            padding:
                45px
                30px
                90px;
        }


        /* Назад */

        .back {
            display: inline-block;

            margin-bottom: 45px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.2s ease;
        }


        .back:hover {
            color: #fff;
        }


        /* Заголовок категории */

        .category-title {
            margin: 0 0 50px;

            text-align: center;

            font-size: 28px;

            font-weight: 400;

            line-height: 1.3;
        }


        /* Сетка */

        .objects {
            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            column-gap: 24px;
            row-gap: 55px;
        }


        /* Карточка */

        .object {
            display: block;

            color: #fff;

            text-decoration: none;
        }


        /* Фотография */

        .photo-wrapper {
            width: 100%;

            aspect-ratio: 4 / 3;

            overflow: hidden;

            background: #111;

            margin-bottom: 15px;
        }


        .photo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform 0.35s ease;
        }


        .object:hover .photo {
            transform:
                scale(1.035);
        }


        /* Название */

        .object-title {
            margin: 0 0 8px;

            color: #fff;

            font-size: 17px;

            line-height: 1.35;

            font-weight: 400;
        }


        /* Краткое описание */

        .object-description {
            margin: 0;

            color: #777;

            font-size: 13px;

            line-height: 1.5;

            display: -webkit-box;

            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* Если ничего нет */

        .empty {
            padding-top: 60px;

            text-align: center;

            color: #666;

            font-size: 16px;
        }


        /* Планшет */

        @media (max-width: 900px) {

            .objects {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );
            }
        }


        /* Телефон */

        @media (max-width: 650px) {

            .page {
                padding:
                    30px
                    18px
                    70px;
            }


            .back {
                margin-bottom: 35px;
            }


            .category-title {
                margin-bottom: 35px;

                font-size: 25px;
            }


            .objects {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                column-gap: 14px;
                row-gap: 38px;
            }


            .photo-wrapper {
                margin-bottom: 11px;
            }


            .object-title {
                font-size: 15px;

                line-height: 1.35;
            }


            .object-description {
                font-size: 12px;

                line-height: 1.45;

                -webkit-line-clamp: 3;
            }
        }


        /* Очень узкий экран */

        @media (max-width: 400px) {

            .objects {
                grid-template-columns: 1fr;
            }


            .object-title {
                font-size: 17px;
            }


            .object-description {
                font-size: 13px;
            }
        }

    </style>
</head>


<body>

<div class="page">

    <a
        href="index.html"
        class="back"
    >
        ← Каталог
    </a>


    <h1
        id="categoryTitle"
        class="category-title"
    ></h1>


    <div
        id="objects"
        class="objects"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display: none;"
    >
        В этой категории пока нет предметов.
    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category");


    const subcategory =
        params.get("subcategory");


    const categoryTitle =
        document.getElementById(
            "categoryTitle"
        );


    const objectsContainer =
        document.getElementById(
            "objects"
        );


    const emptyElement =
        document.getElementById(
            "empty"
        );


    /*
     * Ищем первую фотографию объекта
     * без GitHub API.
     */

    async function findFirstPhoto(folder) {

        const extensions = [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "gif"
        ];


        for (let i = 1; i <= 100; i++) {

            const number =
                String(i).padStart(2, "0");


            for (const extension of extensions) {

                const url =
                    `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`;


                try {

                    const response =
                        await fetch(
                            url,
                            {
                                method: "HEAD",
                                cache: "no-store"
                            }
                        );


                    if (response.ok) {
                        return url;
                    }

                } catch (error) {
                    // Проверяем следующий вариант.
                }
            }
        }


        return null;
    }


    async function loadCategory() {

        if (!category) {

            throw new Error(
                "Категория не указана"
            );
        }


        categoryTitle.textContent =
            subcategory
                ? `${category} · ${subcategory}`
                : category;


        document.title =
            subcategory
                ? `${category} · ${subcategory}`
                : category;


        const catalogResponse =
            await fetch(
                "catalog.json",
                {
                    cache: "no-store"
                }
            );


        if (!catalogResponse.ok) {

            throw new Error(
                "Не удалось загрузить catalog.json"
            );
        }


        const catalog =
            await catalogResponse.json();


        const objects = [];


        /*
         * Загружаем информацию обо всех объектах.
         */

        for (
            const [catalogNumber, folder]
            of Object.entries(catalog)
        ) {

            try {

                const response =
                    await fetch(
                        `objects/${encodeURIComponent(folder)}/info.json`,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {
                    continue;
                }


                const data =
                    await response.json();


                if (
                    data.category !==
                    category
                ) {
                    continue;
                }


                if (
                    subcategory &&
                    data.subcategory !==
                    subcategory
                ) {
                    continue;
                }


                objects.push({
                    catalogNumber,
                    folder,
                    data
                });

            } catch (error) {

                console.error(
                    `Ошибка объекта ${catalogNumber}:`,
                    error
                );
            }
        }


        /*
         * Сортировка по названию.
         */

        objects.sort(
            (a, b) =>
                (a.data.title || "")
                    .localeCompare(
                        b.data.title || "",
                        "ru",
                        {
                            sensitivity: "base"
                        }
                    )
        );


        if (objects.length === 0) {

            emptyElement.style.display =
                "block";

            return;
        }


        /*
         * Создаём карточки.
         */

        for (const object of objects) {

            const data =
                object.data;


            const link =
                document.createElement("a");


            link.className =
                "object";


            link.href =
                `item.html?object=${encodeURIComponent(object.catalogNumber)}`;


            /*
             * Фотография.
             */

            const photoWrapper =
                document.createElement("div");


            photoWrapper.className =
                "photo-wrapper";


            const photo =
                document.createElement("img");


            photo.className =
                "photo";


            photo.alt =
                data.title || "";


            photo.loading =
                "lazy";


            const firstPhoto =
                await findFirstPhoto(
                    object.folder
                );


            if (firstPhoto) {

                photo.src =
                    firstPhoto;

            } else {

                photoWrapper.style.display =
                    "none";
            }


            photoWrapper.appendChild(
                photo
            );


            /*
             * Название.
             */

            const title =
                document.createElement("h2");


            title.className =
                "object-title";


            title.textContent =
                data.title || "";


            /*
             * Краткое описание.
             */

            const description =
                document.createElement("p");


            description.className =
                "object-description";


            description.textContent =
                data.shortDescription || "";


            link.appendChild(
                photoWrapper
            );


            link.appendChild(
                title
            );


            if (
                data.shortDescription
            ) {

                link.appendChild(
                    description
                );
            }


            objectsContainer.appendChild(
                link
            );
        }
    }


    loadCategory()
        .catch(error => {

            console.error(
                "Ошибка загрузки категории:",
                error
            );


            objectsContainer.innerHTML =
                "";


            emptyElement.textContent =
                "Не удалось загрузить категорию.";


            emptyElement.style.display =
                "block";
        });

</script>

</body>
</html>
