<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: min(1400px, calc(100% - 40px));
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .back {
            display: inline-block;
            margin-bottom: 50px;
            color: #999;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            margin: 0 0 50px;
            font-size: 34px;
            font-weight: 400;
            text-align: center;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 50px 24px;
        }

        .card {
            display: block;
            color: #fff;
            text-decoration: none;
        }

        .card-image {
            width: 100%;
            height: 320px;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover .card-image img {
            transform: scale(1.03);
        }

        .card-title {
            margin-top: 16px;
            font-size: 18px;
            line-height: 1.4;
        }

        .card-description {
            margin-top: 8px;
            color: #999;
            font-size: 14px;
            line-height: 1.5;
        }

        .empty {
            color: #777;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width: 1000px) {
            .catalog {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .container {
                width: calc(100% - 28px);
                padding-top: 28px;
            }

            .back {
                margin-bottom: 35px;
            }

            h1 {
                margin-bottom: 35px;
                font-size: 27px;
            }

            .catalog {
                grid-template-columns: repeat(2, 1fr);
                gap: 35px 14px;
            }

            .card-image {
                height: 260px;
            }

            .card-title {
                margin-top: 12px;
                font-size: 16px;
            }

            .card-description {
                font-size: 13px;
            }
        }

        @media (max-width: 420px) {
            .catalog {
                grid-template-columns: 1fr;
            }

            .card-image {
                height: 360px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">← Каталог</a>

    <h1 id="page-title">Все предметы</h1>

    <div id="catalog" class="catalog"></div>

</div>

<script>
    const catalogElement = document.getElementById('catalog');
    const pageTitle = document.getElementById('page-title');

    const params = new URLSearchParams(window.location.search);
    const selectedCategory = params.get('category');
    const selectedSubcategory = params.get('subcategory');

    async function fileExists(url) {
        try {
            const response = await fetch(url, {
                method: 'HEAD',
                cache: 'no-store'
            });

            return response.ok;
        } catch {
            return false;
        }
    }

    async function findFirstPhoto(folder) {
        const extensions = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

        for (let i = 1; i <= 100; i++) {
            const number = String(i).padStart(2, '0');

            for (const extension of extensions) {
                const url = `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`;

                if (await fileExists(url)) {
                    return url;
                }
            }
        }

        return null;
    }

    async function loadCatalog() {
        try {
            const catalogResponse = await fetch('catalog.json', {
                cache: 'no-store'
            });

            const catalog = await catalogResponse.json();

            const objects = [];

            for (const [catalogNumber, folder] of Object.entries(catalog)) {
                try {
                    const response = await fetch(
                        `objects/${encodeURIComponent(folder)}/info.json`,
                        { cache: 'no-store' }
                    );

                    if (!response.ok) {
                        continue;
                    }

                    const data = await response.json();

                    if (
                        selectedCategory &&
                        data.category !== selectedCategory
                    ) {
                        continue;
                    }

                    if (
                        selectedSubcategory &&
                        data.subcategory !== selectedSubcategory
                    ) {
                        continue;
                    }

                    objects.push({
                        catalogNumber,
                        folder,
                        data
                    });

                } catch (error) {
                    console.error(
                        `Ошибка загрузки ${folder}/info.json`,
                        error
                    );
                }
            }

            objects.sort((a, b) =>
                (a.data.title || '').localeCompare(
                    b.data.title || '',
                    'ru'
                )
            );

            if (selectedSubcategory) {
                pageTitle.textContent = selectedSubcategory;
            } else if (selectedCategory) {
                pageTitle.textContent = selectedCategory;
            } else {
                pageTitle.textContent = 'Все предметы';
            }

            if (objects.length === 0) {
                catalogElement.innerHTML =
                    '<div class="empty">Предметов пока нет.</div>';
                return;
            }

            for (const object of objects) {
                const card = document.createElement('a');

                card.className = 'card';
                card.href =
                    `item.html?object=${encodeURIComponent(object.catalogNumber)}`;

                const imageContainer = document.createElement('div');
                imageContainer.className = 'card-image';

                const image = document.createElement('img');

                const photo = await findFirstPhoto(object.folder);

                if (photo) {
                    image.src = photo;
                    image.alt = object.data.title || '';
                    image.loading = 'lazy';
                    imageContainer.appendChild(image);
                }

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = object.data.title || '';

                card.appendChild(imageContainer);
                card.appendChild(title);

                if (object.data.shortDescription) {
                    const description = document.createElement('div');
                    description.className = 'card-description';
                    description.textContent =
                        object.data.shortDescription;

                    card.appendChild(description);
                }

                catalogElement.appendChild(card);
            }

        } catch (error) {
            console.error(error);

            catalogElement.innerHTML =
                '<div class="empty">Не удалось загрузить каталог.</div>';
        }
    }

    loadCatalog();
</script>

</body>
</html>
