<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    min-height: 100vh;
}


/* =========================
   СТРАНИЦА
========================= */

.page {

    width: 100%;

    max-width: 1500px;

    margin: 0 auto;

    padding:
        35px
        30px
        100px;
}


/* =========================
   НАЗАД
========================= */

.back {

    display: block;

    width: fit-content;

    margin-bottom: 35px;

    color: #777;

    font-size: 14px;

    text-decoration: none;

    transition:
        color 0.2s ease;
}

.back:hover {
    color: #fff;
}


/* =========================
   ЗАГОЛОВОК
========================= */

h1 {

    margin: 0 0 45px;

    font-size:
        clamp(
            28px,
            4vw,
            42px
        );

    font-weight: 400;

    line-height: 1.15;
}


/* =========================
   СЕТКА
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 22px;
}


/* =========================
   КАРТОЧКА
========================= */

.card {

    display: block;

    min-width: 0;

    color: #fff;

    text-decoration: none;

    border: 1px solid #252525;

    background: #050505;

    padding: 10px;

    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease;
}

.card:hover {

    border-color: #555;

    background: #080808;

    transform:
        translateY(-2px);
}


/* =========================
   ФОТО КАРТОЧКИ
========================= */

.card-image {

    width: 100%;

    height: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background: #000;
}


.card-image img {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transition:
        transform 0.35s ease;
}


.card:hover
.card-image img {

    transform:
        scale(1.035);
}


/*
 * Если фотография ещё грузится
 */

.card-loading {

    color: #555;

    font-size: 12px;

    text-align: center;
}


/* =========================
   ТЕКСТ КАРТОЧКИ
========================= */

.card-info {

    padding:
        18px
        8px
        10px;
}


.card-title {

    margin: 0;

    color: #fff;

    font-size: 18px;

    font-weight: 400;

    line-height: 1.3;
}


.card-description {

    margin-top: 10px;

    color: #888;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================
   ЕСЛИ НЕТ ПРЕДМЕТОВ
========================= */

.empty {

    color: #666;

    font-size: 14px;
}


/* =========================
   ПЛАНШЕТ
========================= */

@media (max-width: 1100px) {

    .grid {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

    .card-image {

        height: 300px;
    }
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 700px) {

    .page {

        padding:
            25px
            15px
            60px;
    }


    h1 {

        margin-bottom: 30px;
    }


    .grid {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }


    .card {

        padding: 7px;
    }


    .card-image {

        height: 260px;
    }


    .card-info {

        padding:
            14px
            5px
            8px;
    }


    .card-title {

        font-size: 16px;
    }


    .card-description {

        font-size: 13px;

        margin-top: 8px;
    }
}


/* =========================
   ОЧЕНЬ УЗКИЙ ТЕЛЕФОН
========================= */

@media (max-width: 420px) {

    .grid {

        grid-template-columns:
            1fr;

        gap: 16px;
    }


    .card-image {

        height: 360px;
    }


    .card-title {

        font-size: 18px;
    }


    .card-description {

        font-size: 14px;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- НАЗАД -->

    <a
        class="back"
        href="index.html">

        ← Каталог

    </a>


    <!-- ЗАГОЛОВОК -->

    <h1 id="title">
        Все предметы
    </h1>


    <!-- ПРЕДМЕТЫ -->

    <main
        class="grid"
        id="grid">
    </main>


</div>


<script>


/* =========================
   ПАРАМЕТРЫ URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const category =
    params.get("category");


const subcategory =
    params.get("subcategory");


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const title =
    document.getElementById(
        "title"
    );


const grid =
    document.getElementById(
        "grid"
    );


/* =========================
   ЗАГОЛОВОК И ВКЛАДКА
========================= */

if (category) {

    title.textContent =
        subcategory
            ? subcategory
            : category;

} else {

    title.textContent =
        "Все предметы";
}


/*
 * Название во вкладке браузера
 */

document.title =
    subcategory
        ? subcategory
        : category
            ? category
            : "Все предметы";


/* =========================
   URL ФАЙЛОВ
========================= */

function fileUrl(
    folder,
    fileName
) {

    return (
        "objects/" +
        encodeURIComponent(folder) +
        "/" +
        encodeURIComponent(fileName)
    );
}


/* =========================
   ПОИСК ПЕРВОЙ ФОТОГРАФИИ
========================= */

function findFirstPhoto(
    folder,
    img
) {

    const extensions = [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif"
    ];


    let extensionIndex = 0;


    function tryNext() {

        if (
            extensionIndex >=
            extensions.length
        ) {

            img.parentElement.innerHTML =
                '<div class="card-loading">Фотография отсутствует</div>';

            return;
        }


        const extension =
            extensions[
                extensionIndex
            ];


        extensionIndex++;


        const url =
            fileUrl(
                folder,
                "photo-01." +
                extension
            );


        const test =
            new Image();


        test.onload =
            function () {

                img.src =
                    url;

            };


        test.onerror =
            function () {

                tryNext();

            };


        test.src =
            url;
    }


    tryNext();
}


/* =========================
   СОЗДАНИЕ КАРТОЧКИ
========================= */

function createCard(
    id,
    folder,
    data
) {

    const card =
        document.createElement(
            "a"
        );


    card.className =
        "card";


    card.href =
        "item.html?object=" +
        encodeURIComponent(id);


    /*
     * Фотография
     */

    const imageBox =
        document.createElement(
            "div"
        );


    imageBox.className =
        "card-image";


    const img =
        document.createElement(
            "img"
        );


    img.alt =
        data.title || "";


    img.loading =
        "lazy";


    img.decoding =
        "async";


    imageBox.appendChild(
        img
    );


    /*
     * Текст
     */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "card-info";


    const cardTitle =
        document.createElement(
            "h2"
        );


    cardTitle.className =
        "card-title";


    cardTitle.textContent =
        data.title || "";


    info.appendChild(
        cardTitle
    );


    if (
        data.shortDescription
    ) {

        const shortDescription =
            document.createElement(
                "div"
            );


        shortDescription.className =
            "card-description";


        shortDescription.textContent =
            data.shortDescription;


        info.appendChild(
            shortDescription
        );
    }


    /*
     * Собираем карточку
     */

    card.appendChild(
        imageBox
    );


    card.appendChild(
        info
    );


    /*
     * Добавляем на страницу
     */

    grid.appendChild(
        card
    );


    /*
     * Загружаем фотографию
     */

    findFirstPhoto(
        folder,
        img
    );
}


/* =========================
   ЗАГРУЗКА КАТАЛОГА
========================= */

async function loadCatalog() {

    try {

        const response =
            await fetch(
                "catalog.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Не удалось загрузить catalog.json"
            );
        }


        const catalog =
            await response.json();


        /*
         * Загружаем info.json
         * всех предметов параллельно.
         */

        const objects =
            await Promise.all(

                Object.entries(
                    catalog
                ).map(
                    async ([id, folder]) => {

                        try {

                            const response =
                                await fetch(
                                    fileUrl(
                                        folder,
                                        "info.json"
                                    ),
                                    {
                                        cache:
                                            "no-cache"
                                    }
                                );


                            if (
                                !response.ok
                            ) {

                                return null;
                            }


                            const data =
                                await response.json();


                            return {
                                id,
                                folder,
                                data
                            };

                        }

                        catch (error) {

                            console.error(
                                error
                            );

                            return null;
                        }

                    }
                )
            );


        /*
         * Убираем не загрузившиеся.
         */

        let filtered =
            objects.filter(
                object =>
                    object !== null
            );


        /*
         * Фильтр категории.
         */

        if (category) {

            filtered =
                filtered.filter(
                    object =>
                        object.data.category ===
                        category
                );
        }


        /*
         * Фильтр подкатегории.
         */

        if (subcategory) {

            filtered =
                filtered.filter(
                    object =>
                        object.data.subcategory ===
                        subcategory
                );
        }


        /*
         * Сортировка по названию.
         */

        filtered.sort(
            (a, b) =>
                (
                    a.data.title || ""
                ).localeCompare(
                    b.data.title || "",
                    "ru",
                    {
                        sensitivity:
                            "base"
                    }
                )
        );


        /*
         * Если ничего нет.
         */

        if (
            filtered.length === 0
        ) {

            grid.innerHTML =
                '<div class="empty">Предметов пока нет.</div>';

            return;
        }


        /*
         * Создаём карточки.
         */

        filtered.forEach(
            object => {

                createCard(
                    object.id,
                    object.folder,
                    object.data
                );
            }
        );

    }

    catch (error) {

        console.error(error);

        grid.innerHTML =
            '<div class="empty">Не удалось загрузить каталог.</div>';
    }

}


/* =========================
   ЗАПУСК
========================= */

loadCatalog();

</script>

</body>
</html>
