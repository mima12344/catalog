<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Страница предмета</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 1300px;

    margin: 0 auto;

    padding: 30px 30px 100px;

    text-align: center;
}


/* =========================
   НАЗАД
========================= */

.back {
    display: block;

    width: fit-content;

    margin-bottom: 35px;

    color: #777;

    font-size: 14px;

    text-decoration: none;

    transition: color 0.2s ease;
}

.back:hover {
    color: #fff;
}


/* =========================
   ФОТОГАЛЕРЕЯ
========================= */

.gallery {
    position: relative;

    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 15px;
}


/*
 * Это поле существует сразу,
 * даже пока фотография ещё грузится.
 */

.photo-container {

    position: relative;

    width: min(1000px, 88vw);

    height: min(700px, 70vh);

    min-height: 420px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #050505;
}


/*
 * Надпись во время загрузки
 */

.photo-loading {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #666;

    font-size: 14px;

    transition: opacity 0.3s ease;
}


/*
 * Фотография
 */

.photo-container img {

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    display: block;

    opacity: 0;

    transition:
        opacity 0.35s ease,
        transform 0.25s ease;

    cursor: zoom-in;

    user-select: none;
}


/*
 * Когда фотография загрузилась
 */

.photo-container.loaded img {
    opacity: 1;
}

.photo-container.loaded .photo-loading {
    opacity: 0;
}


/*
 * Увеличение фотографии
 */

.photo-container.zoomed {
    cursor: zoom-out;
}

.photo-container.zoomed img {
    transform: scale(2.2);
}


/* =========================
   СТРЕЛКИ
========================= */

.arrow {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.08);

    color: #fff;

    font-size: 32px;

    cursor: pointer;

    z-index: 3;

    transition:
        background 0.2s ease,
        opacity 0.2s ease;
}

.arrow:hover {
    background: rgba(255,255,255,0.18);
}

.arrow:disabled {
    opacity: 0.25;

    cursor: default;
}

.arrow-left {
    left: 10px;
}

.arrow-right {
    right: 10px;
}


/* =========================
   СЧЁТЧИК
========================= */

.photo-counter {

    margin: 15px 0 50px;

    color: #666;

    font-size: 13px;
}


/* =========================
   ИНФОРМАЦИЯ
========================= */

.content {

    max-width: 800px;

    margin: 0 auto;
}

h1 {

    margin: 0 0 35px;

    font-size: clamp(26px, 4vw, 44px);

    font-weight: 400;

    line-height: 1.15;
}


.description {

    max-width: 700px;

    margin: 0 auto 60px;

    padding: 0 20px;

    color: #ddd;

    font-size: 17px;

    line-height: 1.7;

    white-space: pre-line;
}


/* =========================
   ЭКСПЕРТИЗА
========================= */

.expertise {

    width: 100%;

    margin: 0 auto;

    padding-top: 40px;

    border-top: 1px solid #222;
}

.expertise-title {

    margin-bottom: 30px;

    color: #777;

    font-size: 13px;

    letter-spacing: 0.12em;

    text-transform: uppercase;
}

.pdf-viewer {

    width: 100%;

    height: 1100px;

    display: block;

    border: none;

    background: #fff;
}

.expertise-download {

    display: inline-block;

    margin-top: 25px;

    padding: 12px 24px;

    border: 1px solid #444;

    color: #fff;

    text-decoration: none;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.expertise-download:hover {

    background: #fff;

    color: #000;
}

.hidden {
    display: none;
}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 600px) {

    .page {

        padding: 20px 15px 60px;
    }

    .back {

        margin-bottom: 25px;
    }

    .photo-container {

        width: 100%;

        height: 58vh;

        min-height: 330px;
    }

    .arrow {

        width: 42px;
        height: 42px;

        font-size: 25px;
    }

    .arrow-left {
        left: 0;
    }

    .arrow-right {
        right: 0;
    }

    h1 {

        margin-bottom: 25px;
    }

    .description {

        padding: 0 10px;

        font-size: 16px;

        line-height: 1.65;
    }

    .pdf-viewer {

        height: 800px;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- НАЗАД -->

    <a
        id="back"
        class="back"
        href="index.html">

        ← Каталог

    </a>


    <!-- ФОТОГАЛЕРЕЯ -->

    <div
        class="gallery"
        id="gallery">


        <button
            class="arrow arrow-left"
            id="prev"
            aria-label="Предыдущая фотография">

            ‹

        </button>


        <div
            class="photo-container"
            id="photo-container">


            <div
                class="photo-loading"
                id="photo-loading">

                Фотографии загружаются…

            </div>


            <img
                id="photo"
                src=""
                alt="">


        </div>


        <button
            class="arrow arrow-right"
            id="next"
            aria-label="Следующая фотография">

            ›

        </button>


    </div>


    <div
        class="photo-counter"
        id="counter">
    </div>


    <!-- ИНФОРМАЦИЯ -->

    <main class="content">


        <h1 id="title"></h1>


        <div
            class="description"
            id="description">
        </div>


    </main>


    <!-- ЭКСПЕРТИЗА -->

    <section
        class="expertise hidden"
        id="expertise">


        <div class="expertise-title">

            Экспертное заключение

        </div>


        <iframe
            id="pdf-viewer"
            class="pdf-viewer"
            src="">
        </iframe>


        <a
            id="expertise-download"
            class="expertise-download"
            href=""
            download>

            Скачать экспертное заключение

        </a>


    </section>


</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const objectId =
    params.get("object");


let photos = [];

let currentPhoto = 0;

let objectFolder = "";

let photoLoading = false;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const gallery =
    document.getElementById("gallery");

const photoContainer =
    document.getElementById(
        "photo-container"
    );

const photoLoadingText =
    document.getElementById(
        "photo-loading"
    );

const photo =
    document.getElementById("photo");

const counter =
    document.getElementById("counter");

const prev =
    document.getElementById("prev");

const next =
    document.getElementById("next");

const title =
    document.getElementById("title");

const description =
    document.getElementById(
        "description"
    );

const back =
    document.getElementById("back");


/* =========================
   URL ФАЙЛОВ
========================= */

function fileUrl(fileName) {

    return (
        "objects/" +
        encodeURIComponent(objectFolder) +
        "/" +
        encodeURIComponent(fileName)
    );
}


/* =========================
   ЗАГРУЗКА ПРЕДМЕТА
========================= */

async function loadObject() {

    if (!objectId) {

        title.textContent =
            "Предмет не указан";

        gallery.classList.add("hidden");

        counter.classList.add("hidden");

        return;
    }


    try {

        /*
         * catalog.json
         */

        const catalogResponse =
            await fetch(
                "catalog.json",
                {
                    cache: "no-cache"
                }
            );


        if (!catalogResponse.ok) {

            throw new Error(
                "Не удалось загрузить catalog.json"
            );
        }


        const catalog =
            await catalogResponse.json();


        objectFolder =
            catalog[objectId];


        if (!objectFolder) {

            throw new Error(
                "Предмет не найден"
            );
        }


        /*
         * info.json
         */

        const infoResponse =
            await fetch(
                fileUrl("info.json"),
                {
                    cache: "no-cache"
                }
            );


        if (!infoResponse.ok) {

            throw new Error(
                "Не удалось загрузить info.json"
            );
        }


        const data =
            await infoResponse.json();


        /*
         * Заголовок
         */

        document.title =
            data.title ||
            "Страница предмета";


        title.textContent =
            data.title || "";


        description.textContent =
            data.description || "";


        /*
         * Ссылка назад
         */

        if (data.category) {

            let url =
                "category.html?category=" +
                encodeURIComponent(
                    data.category
                );


            if (
                data.subcategory &&
                data.subcategory !== "-"
            ) {

                url +=
                    "&subcategory=" +
                    encodeURIComponent(
                        data.subcategory
                    );
            }


            back.href = url;

            back.textContent =
                "← Категория";

        } else {

            back.href =
                "index.html";

            back.textContent =
                "← Каталог";
        }


        /*
         * Сразу запускаем загрузку
         * фотографий.
         *
         * Экспертизу грузим отдельно,
         * чтобы она не задерживала галерею.
         */

        loadPhotos();

        loadExpertise();

    }

    catch (error) {

        console.error(error);

        title.textContent =
            "Не удалось загрузить предмет.";

    }

}


/* =========================
   ФОТОГРАФИИ
========================= */

async function loadPhotos() {

    /*
     * Галерея уже существует на странице.
     * Поэтому пользователь сразу видит
     * поле и надпись о загрузке.
     */

    photoContainer.classList.remove(
        "loaded"
    );


    /*
     * Получаем список файлов одним
     * запросом к GitHub API.
     *
     * Это намного быстрее, чем
     * проверять photo-01, photo-02...
     * по отдельности.
     */

    const apiUrl =
        "https://api.github.com/repos/" +
        "mima12344/catalog/contents/objects/" +
        encodeURIComponent(objectFolder) +
        "?ref=main";


    try {

        const response =
            await fetch(apiUrl);


        if (!response.ok) {

            throw new Error(
                "Не удалось получить список фотографий"
            );
        }


        const files =
            await response.json();


        /*
         * Находим все фотографии.
         */

        photos =
            files

                .filter(file => {

                    if (
                        file.type !==
                        "file"
                    ) {
                        return false;
                    }

                    return /^photo-\d+\.(jpg|jpeg|png|webp|gif)$/i
                        .test(
                            file.name
                        );
                })

                .sort((a, b) => {

                    const numberA =
                        parseInt(
                            a.name.match(
                                /^photo-(\d+)/i
                            )[1],
                            10
                        );


                    const numberB =
                        parseInt(
                            b.name.match(
                                /^photo-(\d+)/i
                            )[1],
                            10
                        );


                    return (
                        numberA -
                        numberB
                    );
                })

                .map(file =>
                    file.name
                );


        if (photos.length === 0) {

            photoLoadingText.textContent =
                "Фотографии отсутствуют";

            prev.style.display =
                "none";

            next.style.display =
                "none";

            counter.textContent = "";

            return;
        }


        /*
         * Сразу начинаем загружать
         * первую фотографию.
         */

        showPhoto(0);


        /*
         * Остальные фотографии
         * загружаются в фоне.
         */

        preloadPhotos();


        /*
         * Стрелки.
         */

        if (photos.length === 1) {

            prev.style.display =
                "none";

            next.style.display =
                "none";

            counter.textContent =
                "1 / 1";

        } else {

            prev.style.display =
                "";

            next.style.display =
                "";
        }

    }

    catch (error) {

        console.error(error);

        photoLoadingText.textContent =
            "Не удалось загрузить фотографии";

    }

}


/* =========================
   ПРЕДЗАГРУЗКА
========================= */

function preloadPhotos() {

    photos.forEach(
        (fileName, index) => {

            /*
             * Первую фотографию уже
             * загружаем через showPhoto.
             */

            if (index === 0) {
                return;
            }


            const image =
                new Image();


            image.src =
                fileUrl(fileName);
        }
    );

}


/* =========================
   ПОКАЗ ФОТО
========================= */

function showPhoto(index) {

    if (
        photos.length === 0 ||
        photoLoading
    ) {
        return;
    }


    currentPhoto =
        index;


    const url =
        fileUrl(
            photos[currentPhoto]
        );


    /*
     * Сбрасываем увеличение.
     */

    photoContainer.classList.remove(
        "zoomed"
    );


    /*
     * Пока новая фотография
     * не загрузилась, оставляем
     * предыдущую фотографию.
     */

    const newImage =
        new Image();


    newImage.onload =
        function () {

            photo.src =
                url;


            photo.alt =
                title.textContent;


            photoContainer.classList.add(
                "loaded"
            );


            photoLoadingText.textContent =
                "";


            counter.textContent =
                `${currentPhoto + 1} / ${photos.length}`;
        };


    newImage.onerror =
        function () {

            console.error(
                "Не удалось загрузить:",
                url
            );

        };


    newImage.src =
        url;
}


/* =========================
   СТРЕЛКА НАЗАД
========================= */

prev.addEventListener(
    "click",
    function () {

        if (
            photos.length === 0
        ) {
            return;
        }


        let index =
            currentPhoto - 1;


        if (index < 0) {

            index =
                photos.length - 1;
        }


        showPhoto(index);
    }
);


/* =========================
   СТРЕЛКА ВПЕРЁД
========================= */

next.addEventListener(
    "click",
    function () {

        if (
            photos.length === 0
        ) {
            return;
        }


        let index =
            currentPhoto + 1;


        if (
            index >=
            photos.length
        ) {

            index = 0;
        }


        showPhoto(index);
    }
);


/* =========================
   КЛАВИАТУРА
========================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            prev.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            next.click();
        }


        if (
            event.key ===
            "Escape"
        ) {

            photoContainer.classList.remove(
                "zoomed"
            );
        }
    }
);


/* =========================
   УВЕЛИЧЕНИЕ
========================= */

photoContainer.addEventListener(
    "click",
    function (event) {

        /*
         * Не увеличиваем, если нажали
         * на пустое поле до загрузки.
         */

        if (
            !photoContainer.classList.contains(
                "loaded"
            )
        ) {
            return;
        }


        /*
         * Если нажали на фотографию,
         * рассчитываем точку увеличения.
         */

        if (
            event.target !== photo
        ) {
            return;
        }


        if (
            photoContainer.classList.contains(
                "zoomed"
            )
        ) {

            photoContainer.classList.remove(
                "zoomed"
            );

            photo.style.transformOrigin =
                "center center";

            return;
        }


        const rect =
            photo.getBoundingClientRect();


        const x =
            (
                (event.clientX -
                rect.left) /
                rect.width
            ) * 100;


        const y =
            (
                (event.clientY -
                rect.top) /
                rect.height
            ) * 100;


        photo.style.transformOrigin =
            `${x}% ${y}%`;


        photoContainer.classList.add(
            "zoomed"
        );

    }
);


/* =========================
   СВАЙП НА ТЕЛЕФОНЕ
========================= */

let touchStartX = 0;

let touchStartY = 0;


photoContainer.addEventListener(
    "touchstart",
    function (event) {

        if (
            event.touches.length !== 1
        ) {
            return;
        }


        touchStartX =
            event.touches[0].clientX;


        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


photoContainer.addEventListener(
    "touchend",
    function (event) {

        if (
            event.changedTouches.length !== 1
        ) {
            return;
        }


        const endX =
            event.changedTouches[0].clientX;


        const endY =
            event.changedTouches[0].clientY;


        const deltaX =
            endX - touchStartX;


        const deltaY =
            endY - touchStartY;


        /*
         * Реагируем только на
         * горизонтальный свайп.
         */

        if (
            Math.abs(deltaX) < 50 ||
            Math.abs(deltaX) <
            Math.abs(deltaY)
        ) {
            return;
        }


        if (deltaX < 0) {

            next.click();

        } else {

            prev.click();
        }

    },
    {
        passive: true
    }
);


/* =========================
   ЭКСПЕРТИЗА
========================= */

async function loadExpertise() {

    try {

        const apiUrl =
            "https://api.github.com/repos/" +
            "mima12344/catalog/contents/objects/" +
            encodeURIComponent(objectFolder) +
            "?ref=main";


        const response =
            await fetch(apiUrl);


        if (!response.ok) {
            return;
        }


        const files =
            await response.json();


        const expertiseFile =
            files.find(
                file =>
                    file.type ===
                    "file" &&
                    /^expertise.*\.pdf$/i
                        .test(file.name)
            );


        if (!expertiseFile) {
            return;
        }


        const file =
            fileUrl(
                expertiseFile.name
            );


        const expertise =
            document.getElementById(
                "expertise"
            );


        const viewer =
            document.getElementById(
                "pdf-viewer"
            );


        const download =
            document.getElementById(
                "expertise-download"
            );


        viewer.src =
            file + "#view=FitH";


        download.href =
            file;


        expertise.classList.remove(
            "hidden"
        );

    }

    catch (error) {

        console.error(error);

    }

}


/* =========================
   ЗАПУСК
========================= */

loadObject();

</script>

</body>
</html>
