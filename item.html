<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Предмет</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px 100px;
        }

        .back {
            display: inline-block;
            margin-bottom: 40px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #fff;
        }

        .object-number {
            margin-bottom: 12px;
            color: #666;
            font-size: 14px;
        }

        .title {
            margin: 0 0 12px;
            font-size: 32px;
            line-height: 1.25;
            font-weight: 400;
        }

        .category {
            margin-bottom: 35px;
            color: #777;
            font-size: 15px;
        }

        .short-description {
            max-width: 700px;
            margin: 0 auto 45px;
            color: #bbb;
            font-size: 17px;
            line-height: 1.6;
            text-align: center;
        }

        .gallery {
            position: relative;
            width: 100%;
            margin: 0 auto 60px;
        }

        .gallery-image {
            display: block;
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            margin: 0 auto;
        }

        .gallery-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);
            color: #fff;

            font-size: 24px;
            line-height: 42px;
            text-align: center;

            cursor: pointer;
            transition: background 0.2s ease;
        }

        .gallery-button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .gallery-prev {
            left: 15px;
        }

        .gallery-next {
            right: 15px;
        }

        .photo-counter {
            margin-top: 12px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .description {
            max-width: 700px;
            margin: 0 auto 60px;
            padding: 0 20px;
            color: #ddd;
            font-size: 17px;
            line-height: 1.7;
            white-space: pre-line;
        }

        .expertise {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .expertise-title {
            margin: 0 0 20px;
            color: #777;
            font-size: 15px;
            font-weight: 400;
        }

        .expertise-link {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        .expertise-link:hover {
            opacity: 0.65;
        }

        .error {
            padding-top: 100px;
            text-align: center;
            color: #777;
            font-size: 17px;
        }

        @media (max-width: 650px) {

            .page {
                padding: 35px 20px 70px;
            }

            .title {
                font-size: 26px;
            }

            .short-description {
                font-size: 16px;
            }

            .description {
                padding: 0;
                font-size: 16px;
            }

            .expertise {
                padding: 0;
            }

            .gallery-button {
                width: 36px;
                height: 36px;
                line-height: 36px;
                font-size: 20px;
            }

            .gallery-prev {
                left: 8px;
            }

            .gallery-next {
                right: 8px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <a href="index.html" class="back">← Каталог</a>

    <div id="content">

        <div id="objectNumber" class="object-number"></div>

        <h1 id="title" class="title"></h1>

        <div id="category" class="category"></div>

        <div id="shortDescription" class="short-description"></div>

        <div id="gallery" class="gallery" style="display: none;">

            <img
                id="galleryImage"
                class="gallery-image"
                src=""
                alt=""
            >

            <button
                id="prevButton"
                class="gallery-button gallery-prev"
                type="button"
            >
                ‹
            </button>

            <button
                id="nextButton"
                class="gallery-button gallery-next"
                type="button"
            >
                ›
            </button>

            <div id="photoCounter" class="photo-counter"></div>

        </div>

        <div id="description" class="description"></div>

        <div id="expertise" class="expertise" style="display: none;">

            <h2 class="expertise-title">
                Экспертное заключение
            </h2>

            <a
                id="expertiseLink"
                class="expertise-link"
                href=""
                target="_blank"
                rel="noopener"
            >
                Открыть экспертное заключение →
            </a>

        </div>

    </div>

    <div id="error" class="error" style="display: none;">
        Не удалось загрузить предмет.
    </div>

</div>


<script>

    const GITHUB_PAGES_BASE = "";

    const objectNumber =
        new URLSearchParams(window.location.search).get("object");


    const objectNumberElement =
        document.getElementById("objectNumber");

    const titleElement =
        document.getElementById("title");

    const categoryElement =
        document.getElementById("category");

    const shortDescriptionElement =
        document.getElementById("shortDescription");

    const descriptionElement =
        document.getElementById("description");

    const galleryElement =
        document.getElementById("gallery");

    const galleryImage =
        document.getElementById("galleryImage");

    const photoCounter =
        document.getElementById("photoCounter");

    const prevButton =
        document.getElementById("prevButton");

    const nextButton =
        document.getElementById("nextButton");

    const expertiseElement =
        document.getElementById("expertise");

    const expertiseLink =
        document.getElementById("expertiseLink");

    const errorElement =
        document.getElementById("error");


    let photos = [];

    let currentPhoto = 0;


    async function loadCatalog() {

        const response =
            await fetch("catalog.json", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error("Не удалось загрузить catalog.json");
        }

        return await response.json();
    }


    async function loadInfo(folder) {

        const response =
            await fetch(
                `objects/${encodeURIComponent(folder)}/info.json`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error("Не удалось загрузить info.json");
        }

        return await response.json();
    }


    function updateGallery() {

        if (photos.length === 0) {
            galleryElement.style.display = "none";
            return;
        }


        galleryElement.style.display = "block";


        galleryImage.src =
            photos[currentPhoto];

        galleryImage.alt =
            titleElement.textContent;


        photoCounter.textContent =
            `${currentPhoto + 1} / ${photos.length}`;


        if (photos.length <= 1) {

            prevButton.style.display = "none";
            nextButton.style.display = "none";

        } else {

            prevButton.style.display = "block";
            nextButton.style.display = "block";

        }
    }


    prevButton.addEventListener("click", () => {

        if (photos.length === 0) {
            return;
        }

        currentPhoto =
            (currentPhoto - 1 + photos.length) %
            photos.length;

        updateGallery();
    });


    nextButton.addEventListener("click", () => {

        if (photos.length === 0) {
            return;
        }

        currentPhoto =
            (currentPhoto + 1) %
            photos.length;

        updateGallery();
    });


    async function findPhotos(folder) {

        const found = [];

        /*
         * Ищем photo-01.jpg, photo-02.jpg и т. д.
         * Никакого GitHub API здесь нет.
         */

        for (let i = 1; i <= 100; i++) {

            const number =
                String(i).padStart(2, "0");

            const extensions = [
                "jpg",
                "jpeg",
                "png",
                "webp",
                "gif"
            ];

            let foundPhoto = false;


            for (const extension of extensions) {

                const url =
                    `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`;


                try {

                    const response =
                        await fetch(url, {
                            method: "HEAD",
                            cache: "no-store"
                        });

                    if (response.ok) {

                        found.push(url);

                        foundPhoto = true;

                        break;
                    }

                } catch (error) {
                    // Пропускаем отсутствующий файл.
                }
            }


            /*
             * Если фотографии идут подряд и следующей уже нет,
             * дальше искать нет смысла.
             */

            if (!foundPhoto) {
                break;
            }
        }


        return found;
    }


    async function findExpertise(folder) {

        const possibleNames = [
            "expertise-001.pdf",
            "expertise-002.pdf",
            "expertise.pdf"
        ];


        for (const name of possibleNames) {

            const url =
                `objects/${encodeURIComponent(folder)}/${name}`;


            try {

                const response =
                    await fetch(url, {
                        method: "HEAD",
                        cache: "no-store"
                    });

                if (response.ok) {
                    return url;
                }

            } catch (error) {
                // Файла нет — проверяем следующий вариант.
            }
        }


        return null;
    }


    async function loadObject() {

        if (!objectNumber) {
            throw new Error("Не указан номер предмета");
        }


        const catalog =
            await loadCatalog();


        const folder =
            catalog[objectNumber];


        if (!folder) {
            throw new Error(
                `Предмет ${objectNumber} отсутствует в catalog.json`
            );
        }


        const data =
            await loadInfo(folder);


        objectNumberElement.textContent =
            `№ ${data.catalognumber || objectNumber}`;


        titleElement.textContent =
            data.title || "";


        categoryElement.textContent =
            data.subcategory
                ? `${data.category || ""} · ${data.subcategory}`
                : (data.category || "");


        shortDescriptionElement.textContent =
            data.shortDescription || "";


        descriptionElement.textContent =
            data.description || "";


        document.title =
            data.title || "Предмет";


        /*
         * Загружаем фотографии.
         */

        photos =
            await findPhotos(folder);


        currentPhoto = 0;

        updateGallery();


        /*
         * Ищем экспертное заключение.
         */

        const expertise =
            await findExpertise(folder);


        if (expertise) {

            expertiseElement.style.display =
                "block";

            expertiseLink.href =
                expertise;

        }


        /*
         * Показываем содержимое только после успешной загрузки.
         */

        document.getElementById("content")
            .style.display = "block";
    }


    loadObject()
        .catch(error => {

            console.error(
                "Ошибка загрузки предмета:",
                error
            );

            document.getElementById("content")
                .style.display = "none";

            errorElement.style.display =
                "block";
        });

</script>

</body>
</html>
