<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Предмет</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 30px 100px;
        }


        /* =========================
           Кнопка назад
           ========================= */

        .back {
            display: inline-block;
            margin-bottom: 55px;

            color: #777;
            text-decoration: none;

            font-size: 14px;

            transition: color 0.2s ease;
        }

        .back:hover {
            color: #fff;
        }


        /* =========================
           Название
           ========================= */

        .title {
            max-width: 850px;

            margin: 0 auto 45px;

            text-align: center;

            font-size: 34px;
            line-height: 1.3;
            font-weight: 400;
        }


        /* =========================
           Галерея
           ========================= */

        .gallery {
            position: relative;

            width: 100%;

            /*
             * Оставляем свободное место
             * для стрелок по бокам.
             */
            padding: 0 65px;

            margin: 0 auto 65px;
        }

        .gallery-frame {
            width: 100%;
            overflow: hidden;
        }

        .gallery-image {
            display: block;

            width: 100%;
            max-height: 72vh;

            object-fit: contain;

            margin: 0 auto;

            cursor: zoom-in;

            opacity: 1;
            transform: translateX(0);

            transition:
                opacity 0.28s ease,
                transform 0.35s ease;
        }

        .gallery-image.fade-out {
            opacity: 0;
        }


        /*
         * Стрелки находятся ЗА пределами фотографии.
         */

        .gallery-button {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            z-index: 5;

            width: 48px;
            height: 48px;

            padding: 0;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.12);

            color: #fff;

            font-size: 31px;
            line-height: 43px;

            text-align: center;

            cursor: pointer;

            opacity: 0.9;

            transition:
                background 0.2s ease,
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .gallery-button:hover {
            background: rgba(255, 255, 255, 0.25);
            opacity: 1;
        }

        .gallery-button:active {
            transform: translateY(-50%) scale(0.94);
        }

        .gallery-prev {
            left: 5px;
        }

        .gallery-next {
            right: 5px;
        }


        .photo-counter {
            margin-top: 12px;

            text-align: center;

            color: #666;

            font-size: 13px;
        }


        /* =========================
           Полное описание
           ========================= */

        .description {
            max-width: 1100px;

            margin: 0 auto 70px;

            padding: 0 20px;

            color: #ddd;

            font-size: 17px;
            line-height: 1.75;

            text-align: left;

            /*
             * Сохраняет \n\n из info.json.
             */
            white-space: pre-line;

            /*
             * На компьютере — две колонки.
             * Браузер сам распределяет текст.
             */
            column-count: 2;
            column-gap: 70px;
        }


        /* =========================
           Экспертное заключение
           ========================= */

        .expertise {
            max-width: 720px;

            margin: 0 auto;

            padding: 0 20px;

            text-align: center;
        }

        .expertise-title {
            margin: 0 0 20px;

            color: #777;

            font-size: 15px;
            font-weight: 400;
        }

        .expertise-links {
            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;
        }

        .expertise-link {
            display: inline-block;

            color: #fff;

            text-decoration: none;

            font-size: 15px;

            transition: opacity 0.2s ease;
        }

        .expertise-link:hover {
            opacity: 0.6;
        }


        /* =========================
           Увеличенное фото
           ========================= */

        .photo-lightbox {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 40px;

            background: rgba(0, 0, 0, 0.94);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        .photo-lightbox.open {
            opacity: 1;
            visibility: visible;
        }

        .photo-lightbox-image {
            max-width: 95vw;
            max-height: 92vh;

            object-fit: contain;

            cursor: zoom-out;

            user-select: none;
            -webkit-user-select: none;

            /*
             * Позволяет pinch-to-zoom
             * на телефоне.
             */
            touch-action: pinch-zoom;
        }

        .lightbox-close {
            position: fixed;

            top: 20px;
            right: 25px;

            z-index: 1001;

            width: 42px;
            height: 42px;

            padding: 0;

            border: 0;

            background: transparent;

            color: #fff;

            font-size: 32px;
            line-height: 42px;

            cursor: pointer;

            opacity: 0.7;
        }

        .lightbox-close:hover {
            opacity: 1;
        }


        /* =========================
           Ошибка
           ========================= */

        .error {
            padding-top: 100px;

            text-align: center;

            color: #777;

            font-size: 17px;
        }


        /* =========================
           Телефон
           ========================= */

        @media (max-width: 650px) {

            .page {
                padding:
                    30px
                    18px
                    70px;
            }

            .back {
                margin-bottom: 38px;

                font-size: 14px;
            }

            .title {
                margin-bottom: 30px;

                font-size: 27px;

                line-height: 1.3;
            }


            /*
             * На телефоне пространство под
             * стрелки делаем меньше.
             */
            .gallery {
                padding: 0 48px;

                margin-bottom: 50px;
            }

            .gallery-image {
                max-height: 65vh;
            }

            .gallery-button {
                width: 40px;
                height: 40px;

                font-size: 25px;
                line-height: 35px;
            }

            .gallery-prev {
                left: 2px;
            }

            .gallery-next {
                right: 2px;
            }


            /*
             * На телефоне одна колонка.
             */
            .description {
                padding: 0 5px;

                font-size: 16px;

                line-height: 1.7;

                column-count: 1;
            }

            .expertise {
                padding: 0 5px;
            }


            .photo-lightbox {
                padding: 15px;
            }

            .lightbox-close {
                top: 10px;
                right: 12px;
            }
        }
    </style>
</head>


<body>

<div class="page">

    <a
        href="index.html"
        class="back"
    >
        ← Каталог
    </a>


    <main id="content">

        <h1
            id="title"
            class="title"
        ></h1>


        <section
            id="gallery"
            class="gallery"
            style="display: none;"
        >

            <div class="gallery-frame">

                <img
                    id="galleryImage"
                    class="gallery-image"
                    src=""
                    alt=""
                >

            </div>


            <button
                id="prevButton"
                class="gallery-button gallery-prev"
                type="button"
                aria-label="Предыдущая фотография"
            >
                ‹
            </button>


            <button
                id="nextButton"
                class="gallery-button gallery-next"
                type="button"
                aria-label="Следующая фотография"
            >
                ›
            </button>


            <div
                id="photoCounter"
                class="photo-counter"
            ></div>

        </section>


        <div
            id="description"
            class="description"
        ></div>


        <section
            id="expertise"
            class="expertise"
            style="display: none;"
        >

            <h2 class="expertise-title">
                Экспертное заключение
            </h2>


            <div class="expertise-links">

                <a
                    id="expertiseOpen"
                    class="expertise-link"
                    href=""
                    target="_blank"
                    rel="noopener"
                >
                    Открыть
                </a>


                <a
                    id="expertiseDownload"
                    class="expertise-link"
                    href=""
                    download
                >
                    Скачать
                </a>

            </div>

        </section>

    </main>


    <div
        id="error"
        class="error"
        style="display: none;"
    >
        Не удалось загрузить предмет.
    </div>

</div>


<!-- =========================
     Увеличенное изображение
     ========================= -->

<div
    id="photoLightbox"
    class="photo-lightbox"
>

    <button
        id="lightboxClose"
        class="lightbox-close"
        type="button"
        aria-label="Закрыть"
    >
        ×
    </button>


    <img
        id="lightboxImage"
        class="photo-lightbox-image"
        src=""
        alt=""
    >

</div>


<script>

    const objectNumber =
        new URLSearchParams(
            window.location.search
        ).get("object");


    const titleElement =
        document.getElementById("title");


    const galleryElement =
        document.getElementById("gallery");


    const galleryImage =
        document.getElementById("galleryImage");


    const photoCounter =
        document.getElementById("photoCounter");


    const prevButton =
        document.getElementById("prevButton");


    const nextButton =
        document.getElementById("nextButton");


    const descriptionElement =
        document.getElementById("description");


    const expertiseElement =
        document.getElementById("expertise");


    const expertiseOpen =
        document.getElementById("expertiseOpen");


    const expertiseDownload =
        document.getElementById("expertiseDownload");


    const errorElement =
        document.getElementById("error");


    /*
     * Lightbox
     */

    const photoLightbox =
        document.getElementById(
            "photoLightbox"
        );


    const lightboxImage =
        document.getElementById(
            "lightboxImage"
        );


    const lightboxClose =
        document.getElementById(
            "lightboxClose"
        );


    let photos = [];

    let currentPhoto = 0;

    let changingPhoto = false;


    /* =========================
       Загрузка каталога
       ========================= */

    async function loadCatalog() {

        const response =
            await fetch(
                "catalog.json",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Не удалось загрузить catalog.json"
            );
        }


        return await response.json();
    }


    /* =========================
       Загрузка info.json
       ========================= */

    async function loadInfo(folder) {

        const response =
            await fetch(
                `objects/${encodeURIComponent(folder)}/info.json`,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Не удалось загрузить info.json"
            );
        }


        return await response.json();
    }


    /* =========================
       Поиск фотографий
       ========================= */

    async function findPhotos(folder) {

        const found = [];


        const extensions = [
            "jpg",
            "jpeg",
            "png",
            "webp",
            "gif"
        ];


        for (let i = 1; i <= 100; i++) {

            const number =
                String(i).padStart(2, "0");


            let foundPhoto = false;


            for (
                const extension
                of extensions
            ) {

                const url =
                    `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`;


                try {

                    const response =
                        await fetch(
                            url,
                            {
                                method: "HEAD",
                                cache: "no-store"
                            }
                        );


                    if (response.ok) {

                        found.push(url);

                        foundPhoto = true;

                        break;
                    }

                } catch (error) {

                    /*
                     * Файл отсутствует.
                     */
                }
            }


            /*
             * Если следующей фотографии нет,
             * дальше искать бессмысленно.
             */

            if (!foundPhoto) {
                break;
            }
        }


        return found;
    }


    /* =========================
       Поиск экспертного заключения
       ========================= */

    async function findExpertise(folder) {

        const possibleNames = [

            "expertise-001.pdf",

            "expertise-002.pdf",

            "expertise.pdf"

        ];


        for (
            const name
            of possibleNames
        ) {

            const url =
                `objects/${encodeURIComponent(folder)}/${name}`;


            try {

                const response =
                    await fetch(
                        url,
                        {
                            method: "HEAD",
                            cache: "no-store"
                        }
                    );


                if (response.ok) {

                    return url;
                }

            } catch (error) {

                /*
                 * Проверяем следующий вариант.
                 */
            }
        }


        return null;
    }


    /* =========================
       Обновление галереи
       ========================= */

    function updateGallery() {

        if (photos.length === 0) {

            galleryElement.style.display =
                "none";

            return;
        }


        galleryElement.style.display =
            "block";


        galleryImage.src =
            photos[currentPhoto];


        galleryImage.alt =
            titleElement.textContent;


        photoCounter.textContent =
            `${currentPhoto + 1} / ${photos.length}`;


        if (photos.length <= 1) {

            prevButton.style.display =
                "none";

            nextButton.style.display =
                "none";

        } else {

            prevButton.style.display =
                "block";

            nextButton.style.display =
                "block";
        }
    }


    /* =========================
       Перелистывание
       ========================= */

    function changePhoto(direction) {

        if (
            photos.length <= 1 ||
            changingPhoto
        ) {
            return;
        }


        changingPhoto = true;


        galleryImage.classList.add(
            "fade-out"
        );


        setTimeout(() => {

            currentPhoto =
                (
                    currentPhoto +
                    direction +
                    photos.length
                ) % photos.length;


            galleryImage.src =
                photos[currentPhoto];


            photoCounter.textContent =
                `${currentPhoto + 1} / ${photos.length}`;


            galleryImage.onload =
                () => {

                    galleryImage.classList.remove(
                        "fade-out"
                    );

                    changingPhoto = false;
                };


            /*
             * Запасной вариант для изображения,
             * которое уже находится в кэше.
             */

            setTimeout(() => {

                galleryImage.classList.remove(
                    "fade-out"
                );

                changingPhoto = false;

            }, 400);

        }, 220);
    }


    prevButton.addEventListener(
        "click",
        () => changePhoto(-1)
    );


    nextButton.addEventListener(
        "click",
        () => changePhoto(1)
    );


    /* =========================
       Свайп на телефоне
       ========================= */

    let touchStartX = 0;

    let touchEndX = 0;


    galleryElement.addEventListener(
        "touchstart",
        event => {

            touchStartX =
                event.changedTouches[0].screenX;

        },
        {
            passive: true
        }
    );


    galleryElement.addEventListener(
        "touchend",
        event => {

            touchEndX =
                event.changedTouches[0].screenX;


            const difference =
                touchEndX - touchStartX;


            if (
                Math.abs(difference) < 50
            ) {
                return;
            }


            if (difference > 0) {

                changePhoto(-1);

            } else {

                changePhoto(1);
            }

        },
        {
            passive: true
        }
    );


    /* =========================
       Увеличение фотографии
       ========================= */

    function openLightbox() {

        if (!galleryImage.src) {
            return;
        }


        lightboxImage.src =
            galleryImage.src;


        lightboxImage.alt =
            galleryImage.alt;


        photoLightbox.classList.add(
            "open"
        );


        document.body.style.overflow =
            "hidden";
    }


    function closeLightbox() {

        photoLightbox.classList.remove(
            "open"
        );


        document.body.style.overflow =
            "";
    }


    galleryImage.addEventListener(
        "click",
        openLightbox
    );


    lightboxClose.addEventListener(
        "click",
        closeLightbox
    );


    /*
     * Клик по тёмному фону закрывает фото.
     */

    photoLightbox.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                photoLightbox
            ) {

                closeLightbox();
            }
        }
    );


    /*
     * Esc закрывает увеличенное фото.
     */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                photoLightbox.classList.contains(
                    "open"
                )
            ) {

                closeLightbox();
            }
        }
    );


    /* =========================
       Загрузка предмета
       ========================= */

    async function loadObject() {

        if (!objectNumber) {

            throw new Error(
                "Не указан объект"
            );
        }


        const catalog =
            await loadCatalog();


        const folder =
            catalog[objectNumber];


        if (!folder) {

            throw new Error(
                "Объект отсутствует в catalog.json"
            );
        }


        const data =
            await loadInfo(folder);


        /*
         * Номер каталога и категория
         * специально НЕ показываются.
         */

        titleElement.textContent =
            data.title || "";


        descriptionElement.textContent =
            data.description || "";


        document.title =
            data.title || "Предмет";


        /*
         * Фотографии.
         */

        photos =
            await findPhotos(folder);


        currentPhoto = 0;


        updateGallery();


        /*
         * Экспертное заключение.
         *
         * Если PDF нет,
         * весь раздел остаётся скрытым.
         */

        const expertise =
            await findExpertise(folder);


        if (expertise) {

            expertiseElement.style.display =
                "block";


            expertiseOpen.href =
                expertise;


            expertiseDownload.href =
                expertise;
        }
    }


    /* =========================
       Запуск
       ========================= */

    loadObject()
        .catch(error => {

            console.error(
                "Ошибка загрузки предмета:",
                error
            );


            document.getElementById(
                "content"
            ).style.display =
                "none";


            errorElement.style.display =
                "block";
        });

</script>

</body>
</html>
