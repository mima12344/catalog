<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предмет</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .back {
            display: inline-block;
            margin-bottom: 45px;
            color: #999;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            max-width: 850px;
            margin: 0 auto 45px;
            font-size: 34px;
            line-height: 1.25;
            font-weight: 400;
            text-align: center;
        }

        .gallery {
            position: relative;
            width: 100%;
            padding: 0 65px;
            margin-bottom: 55px;
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            height: 65vh;
            min-height: 400px;
            max-height: 700px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            background: #000;
        }

        .gallery-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;

            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .gallery-frame.zoomed img {
            cursor: zoom-out;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 48px;
            height: 48px;

            border: 0;
            background: transparent;
            color: #fff;

            font-size: 34px;
            line-height: 1;

            cursor: pointer;
            z-index: 5;

            opacity: 0.65;
            transition: opacity 0.2s ease;
        }

        .gallery-arrow:hover {
            opacity: 1;
        }

        .gallery-arrow.prev {
            left: 5px;
        }

        .gallery-arrow.next {
            right: 5px;
        }

        .description {
            max-width: 720px;
            margin: 0 auto 70px;
            padding: 0 20px;

            text-align: left;
            white-space: pre-line;

            font-size: 17px;
            line-height: 1.75;
        }

        .expertise {
            max-width: 720px;
            margin: 0 auto;

            padding: 30px 20px 0;
            border-top: 1px solid #222;
        }

        .expertise-title {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .expertise-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .expertise-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .expertise-links a:hover {
            color: #fff;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                width: calc(100% - 28px);
                padding-top: 28px;
            }

            .back {
                margin-bottom: 35px;
            }

            h1 {
                margin-bottom: 30px;
                font-size: 27px;
            }

            .gallery {
                padding: 0 48px;
                margin-bottom: 40px;
            }

            .gallery-frame {
                height: 52vh;
                min-height: 280px;
                max-height: 520px;
            }

            .gallery-arrow {
                width: 40px;
                height: 40px;
                font-size: 28px;
            }

            .gallery-arrow.prev {
                left: 2px;
            }

            .gallery-arrow.next {
                right: 2px;
            }

            .description {
                padding: 0 10px;
                margin-bottom: 50px;
                font-size: 16px;
                line-height: 1.7;
            }

            .expertise {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back" id="back-link">
        ← Категория
    </a>

    <h1 id="title"></h1>

    <div id="gallery" class="gallery hidden">

        <button
            class="gallery-arrow prev"
            id="prev"
            type="button"
            aria-label="Предыдущее фото"
        >‹</button>

        <div class="gallery-frame" id="gallery-frame">
            <img id="main-image" alt="">
        </div>

        <button
            class="gallery-arrow next"
            id="next"
            type="button"
            aria-label="Следующее фото"
        >›</button>

    </div>

    <div id="description" class="description"></div>

    <div id="expertise" class="expertise hidden">

        <div class="expertise-title">
            Заключение эксперта
        </div>

        <div class="expertise-links">

            <a
                id="expertise-open"
                href="#"
                target="_blank"
                rel="noopener"
            >Открыть</a>

            <a
                id="expertise-download"
                href="#"
                download
            >Скачать</a>

        </div>

    </div>

</div>

<script>
    const titleElement =
        document.getElementById('title');

    const descriptionElement =
        document.getElementById('description');

    const backLink =
        document.getElementById('back-link');

    const gallery =
        document.getElementById('gallery');

    const galleryFrame =
        document.getElementById('gallery-frame');

    const mainImage =
        document.getElementById('main-image');

    const prevButton =
        document.getElementById('prev');

    const nextButton =
        document.getElementById('next');

    const expertise =
        document.getElementById('expertise');

    const expertiseOpen =
        document.getElementById('expertise-open');

    const expertiseDownload =
        document.getElementById('expertise-download');

    const params =
        new URLSearchParams(window.location.search);

    const objectNumber =
        params.get('object');

    let photos = [];
    let currentPhoto = 0;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;


    /*
     * Проверяем существование изображения
     * обычной загрузкой Image.
     */

    function checkImage(url) {
        return new Promise(resolve => {

            const image = new Image();

            image.onload = () => {
                resolve(url);
            };

            image.onerror = () => {
                resolve(null);
            };

            image.src = url;
        });
    }


    /*
     * Ищем фотографии.
     *
     * photo-01, photo-02, photo-03...
     *
     * Поддерживаются jpg/jpeg/png/webp/gif.
     */

    async function findPhotos(folder) {

        const extensions = [
            'jpg',
            'jpeg',
            'png',
            'webp',
            'gif'
        ];

        const result = [];

        for (let i = 1; i <= 100; i++) {

            const number =
                String(i).padStart(2, '0');

            const candidates =
                extensions.map(extension =>
                    `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`
                );

            const loaded =
                await Promise.all(
                    candidates.map(checkImage)
                );

            const found =
                loaded.find(url => url !== null);

            if (found) {

                result.push(found);

            } else if (result.length > 0) {

                /*
                 * Фотографии идут подряд.
                 * Если уже нашли хотя бы одну и
                 * следующий номер отсутствует —
                 * прекращаем поиск.
                 */

                break;
            }
        }

        return result;
    }


    /*
     * Ищем заключение эксперта.
     */

    async function findExpertise(folder) {

        const filenames = [
            'expertise-001.pdf',
            'expertise-002.pdf',
            'expertise.pdf'
        ];

        for (const filename of filenames) {

            const url =
                `objects/${encodeURIComponent(folder)}/${filename}`;

            try {

                const response =
                    await fetch(url, {
                        cache: 'no-store'
                    });

                if (response.ok) {
                    return url;
                }

            } catch {
                // следующий файл
            }
        }

        return null;
    }


    /*
     * Показ фотографии.
     */

    function showPhoto(index, animate = true) {

        if (!photos.length) {
            return;
        }

        currentPhoto =
            (index + photos.length) %
            photos.length;

        resetZoom();

        if (animate) {

            mainImage.style.opacity = '0';

            setTimeout(() => {

                mainImage.src =
                    photos[currentPhoto];

                mainImage.style.opacity = '1';

            }, 120);

        } else {

            mainImage.src =
                photos[currentPhoto];

            mainImage.style.opacity = '1';
        }
    }


    function updateArrows() {

        const visible =
            photos.length > 1;

        prevButton.style.display =
            visible ? 'block' : 'none';

        nextButton.style.display =
            visible ? 'block' : 'none';
    }


    /*
     * Лупа.
     */

    function resetZoom() {

        galleryFrame.classList.remove('zoomed');

        mainImage.style.transform =
            'scale(1)';

        mainImage.style.transformOrigin =
            'center center';
    }


    function toggleZoom(x, y) {

        if (!photos.length) {
            return;
        }

        if (
            galleryFrame.classList.contains('zoomed')
        ) {

            resetZoom();
            return;
        }

        const rect =
            galleryFrame.getBoundingClientRect();

        const originX =
            ((x - rect.left) / rect.width) * 100;

        const originY =
            ((y - rect.top) / rect.height) * 100;

        mainImage.style.transformOrigin =
            `${originX}% ${originY}%`;

        mainImage.style.transform =
            'scale(2.2)';

        galleryFrame.classList.add('zoomed');
    }


    /*
     * Кнопки.
     */

    prevButton.addEventListener(
        'click',
        () => showPhoto(currentPhoto - 1)
    );

    nextButton.addEventListener(
        'click',
        () => showPhoto(currentPhoto + 1)
    );


    /*
     * Клавиатура.
     */

    document.addEventListener(
        'keydown',
        event => {

            if (event.key === 'ArrowLeft') {
                showPhoto(currentPhoto - 1);
            }

            if (event.key === 'ArrowRight') {
                showPhoto(currentPhoto + 1);
            }

            if (event.key === 'Escape') {
                resetZoom();
            }
        }
    );


    /*
     * Клик мышью.
     */

    mainImage.addEventListener(
        'click',
        event => {

            if (touchMoved) {
                touchMoved = false;
                return;
            }

            toggleZoom(
                event.clientX,
                event.clientY
            );
        }
    );


    /*
     * Телефон — начало свайпа.
     */

    mainImage.addEventListener(
        'touchstart',
        event => {

            if (event.touches.length !== 1) {
                return;
            }

            touchMoved = false;

            touchStartX =
                event.touches[0].clientX;

            touchStartY =
                event.touches[0].clientY;

        },
        {
            passive: true
        }
    );


    /*
     * Телефон — движение.
     */

    mainImage.addEventListener(
        'touchmove',
        event => {

            if (event.touches.length !== 1) {
                return;
            }

            const deltaX =
                event.touches[0].clientX -
                touchStartX;

            const deltaY =
                event.touches[0].clientY -
                touchStartY;

            if (
                Math.abs(deltaX) > 10 ||
                Math.abs(deltaY) > 10
            ) {
                touchMoved = true;
            }

        },
        {
            passive: true
        }
    );


    /*
     * Телефон — конец свайпа.
     */

    mainImage.addEventListener(
        'touchend',
        event => {

            if (event.changedTouches.length !== 1) {
                return;
            }

            const touch =
                event.changedTouches[0];

            const deltaX =
                touch.clientX -
                touchStartX;

            const deltaY =
                touch.clientY -
                touchStartY;

            if (
                Math.abs(deltaX) < 50 ||
                Math.abs(deltaX) <= Math.abs(deltaY)
            ) {
                return;
            }

            if (deltaX < 0) {
                showPhoto(currentPhoto + 1);
            } else {
                showPhoto(currentPhoto - 1);
            }

        },
        {
            passive: true
        }
    );


    /*
     * Загружаем предмет.
     */

    async function loadItem() {

        try {

            const catalogResponse =
                await fetch(
                    'catalog.json',
                    {
                        cache: 'no-store'
                    }
                );

            if (!catalogResponse.ok) {
                throw new Error(
                    'Не удалось загрузить catalog.json'
                );
            }

            const catalog =
                await catalogResponse.json();

            const folder =
                catalog[objectNumber];

            if (!folder) {
                throw new Error(
                    'Предмет не найден'
                );
            }


            /*
             * info.json
             */

            const infoResponse =
                await fetch(
                    `objects/${encodeURIComponent(folder)}/info.json`,
                    {
                        cache: 'no-store'
                    }
                );

            if (!infoResponse.ok) {
                throw new Error(
                    'Не удалось загрузить info.json'
                );
            }

            const data =
                await infoResponse.json();


            /*
             * Название.
             */

            titleElement.textContent =
                data.title || '';


            /*
             * Описание.
             */

            descriptionElement.textContent =
                data.description || '';


            /*
             * Возврат.
             */

            if (data.category) {

                let url =
                    `category.html?category=${encodeURIComponent(data.category)}`;

                if (
                    data.subcategory &&
                    data.subcategory !== '-'
                ) {

                    url +=
                        `&subcategory=${encodeURIComponent(data.subcategory)}`;
                }

                backLink.href =
                    url;

                backLink.textContent =
                    '← Категория';

            } else {

                backLink.href =
                    'index.html';

                backLink.textContent =
                    '← Каталог';
            }


            /*
             * Фотографии.
             */

            photos =
                await findPhotos(folder);

            if (photos.length > 0) {

                gallery.classList.remove('hidden');

                showPhoto(
                    0,
                    false
                );

                updateArrows();

            } else {

                gallery.classList.add('hidden');

                console.error(
                    'Фотографии не найдены:',
                    folder
                );
            }


            /*
             * Экспертиза.
             */

            const expertiseFile =
                await findExpertise(folder);

            if (expertiseFile) {

                expertise.classList.remove('hidden');

                expertiseOpen.href =
                    expertiseFile;

                expertiseDownload.href =
                    expertiseFile;

            } else {

                expertise.classList.add('hidden');
            }

        } catch (error) {

            console.error(error);

            titleElement.textContent =
                'Предмет не найден';

            descriptionElement.textContent =
                '';

            gallery.classList.add('hidden');

            expertise.classList.add('hidden');
        }
    }


    loadItem();
</script>

</body>
</html>
