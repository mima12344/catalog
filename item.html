<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предмет</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            padding: 40px 0 80px;
        }

        .back {
            display: inline-block;
            margin-bottom: 45px;
            color: #999;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .back:hover {
            color: #fff;
        }

        h1 {
            max-width: 850px;
            margin: 0 auto 45px;
            font-size: 34px;
            line-height: 1.25;
            font-weight: 400;
            text-align: center;
        }

        .gallery {
            position: relative;
            width: 100%;
            padding: 0 65px;
            margin-bottom: 55px;
        }

        .gallery-frame {
            position: relative;
            width: 100%;
            height: 65vh;
            min-height: 400px;
            max-height: 700px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            background: #000;
        }

        .gallery-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;

            cursor: zoom-in;
            user-select: none;
            -webkit-user-drag: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .gallery-frame.zoomed img {
            cursor: zoom-out;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 48px;
            height: 48px;

            border: 0;
            background: transparent;
            color: #fff;

            font-size: 34px;
            line-height: 1;

            cursor: pointer;
            z-index: 5;

            opacity: 0.65;
            transition: opacity 0.2s ease;
        }

        .gallery-arrow:hover {
            opacity: 1;
        }

        .gallery-arrow.prev {
            left: 5px;
        }

        .gallery-arrow.next {
            right: 5px;
        }

        .description {
            max-width: 720px;
            margin: 0 auto 70px;
            padding: 0 20px;

            text-align: left;
            white-space: pre-line;

            font-size: 17px;
            line-height: 1.75;
        }

        .expertise {
            max-width: 720px;
            margin: 0 auto;

            padding: 30px 20px 0;
            border-top: 1px solid #222;
        }

        .expertise-title {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .expertise-links {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .expertise-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .expertise-links a:hover {
            color: #fff;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                width: calc(100% - 28px);
                padding-top: 28px;
            }

            .back {
                margin-bottom: 35px;
            }

            h1 {
                margin-bottom: 30px;
                font-size: 27px;
            }

            .gallery {
                padding: 0 48px;
                margin-bottom: 40px;
            }

            .gallery-frame {
                height: 52vh;
                min-height: 280px;
                max-height: 520px;
            }

            .gallery-arrow {
                width: 40px;
                height: 40px;
                font-size: 28px;
            }

            .gallery-arrow.prev {
                left: 2px;
            }

            .gallery-arrow.next {
                right: 2px;
            }

            .description {
                padding: 0 10px;
                margin-bottom: 50px;
                font-size: 16px;
                line-height: 1.7;
            }

            .expertise {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back" id="back-link">← Категория</a>

    <h1 id="title"></h1>

    <div id="gallery" class="gallery hidden">

        <button
            class="gallery-arrow prev"
            id="prev"
            type="button"
            aria-label="Предыдущее фото"
        >
            ‹
        </button>

        <div class="gallery-frame" id="gallery-frame">
            <img id="main-image" alt="">
        </div>

        <button
            class="gallery-arrow next"
            id="next"
            type="button"
            aria-label="Следующее фото"
        >
            ›
        </button>

    </div>

    <div id="description" class="description"></div>

    <div id="expertise" class="expertise hidden">

        <div class="expertise-title">
            Заключение эксперта
        </div>

        <div class="expertise-links">

            <a
                id="expertise-open"
                href="#"
                target="_blank"
                rel="noopener"
            >
                Открыть
            </a>

            <a
                id="expertise-download"
                href="#"
                download
            >
                Скачать
            </a>

        </div>

    </div>

</div>

<script>
    const titleElement = document.getElementById('title');
    const descriptionElement =
        document.getElementById('description');

    const backLink =
        document.getElementById('back-link');

    const gallery =
        document.getElementById('gallery');

    const galleryFrame =
        document.getElementById('gallery-frame');

    const mainImage =
        document.getElementById('main-image');

    const prevButton =
        document.getElementById('prev');

    const nextButton =
        document.getElementById('next');

    const expertise =
        document.getElementById('expertise');

    const expertiseOpen =
        document.getElementById('expertise-open');

    const expertiseDownload =
        document.getElementById('expertise-download');

    const params =
        new URLSearchParams(window.location.search);

    const objectNumber =
        params.get('object');

    let photos = [];
    let currentPhoto = 0;

    let touchStartX = 0;
    let touchStartY = 0;

    async function fileExists(url) {
        try {
            const response = await fetch(url, {
                method: 'HEAD',
                cache: 'no-store'
            });

            return response.ok;
        } catch {
            return false;
        }
    }

    async function findPhotos(folder) {
        const extensions = [
            'jpg',
            'jpeg',
            'png',
            'webp',
            'gif'
        ];

        const result = [];

        for (let i = 1; i <= 100; i++) {
            const number =
                String(i).padStart(2, '0');

            let found = false;

            for (const extension of extensions) {
                const url =
                    `objects/${encodeURIComponent(folder)}/photo-${number}.${extension}`;

                if (await fileExists(url)) {
                    result.push(url);
                    found = true;
                    break;
                }
            }

            if (!found && i > 1) {
                continue;
            }
        }

        return result;
    }

    async function findExpertise(folder) {
        const filenames = [
            'expertise-001.pdf',
            'expertise-002.pdf',
            'expertise.pdf'
        ];

        for (const filename of filenames) {
            const url =
                `objects/${encodeURIComponent(folder)}/${filename}`;

            if (await fileExists(url)) {
                return url;
            }
        }

        return null;
    }

    function showPhoto(index, animate = true) {
        if (!photos.length) {
            return;
        }

        currentPhoto =
            (index + photos.length) % photos.length;

        galleryFrame.classList.remove('zoomed');

        if (animate) {
            mainImage.style.opacity = '0';

            setTimeout(() => {
                mainImage.src = photos[currentPhoto];
                mainImage.style.opacity = '1';
            }, 120);
        } else {
            mainImage.src = photos[currentPhoto];
            mainImage.style.opacity = '1';
        }
    }

    function updateArrows() {
        const shouldShow =
            photos.length > 1;

        prevButton.style.display =
            shouldShow ? 'block' : 'none';

        nextButton.style.display =
            shouldShow ? 'block' : 'none';
    }

    function resetZoom() {
        galleryFrame.classList.remove('zoomed');

        mainImage.style.transform =
            'scale(1)';

        mainImage.style.transformOrigin =
            'center center';
    }

    function toggleZoom(event) {
        if (!photos.length) {
            return;
        }

        if (galleryFrame.classList.contains('zoomed')) {
            resetZoom();
            return;
        }

        const rect =
            galleryFrame.getBoundingClientRect();

        const x =
            ((event.clientX - rect.left) / rect.width) * 100;

        const y =
            ((event.clientY - rect.top) / rect.height) * 100;

        mainImage.style.transformOrigin =
            `${x}% ${y}%`;

        mainImage.style.transform =
            'scale(2.2)';

        galleryFrame.classList.add('zoomed');
    }

    prevButton.addEventListener('click', () => {
        showPhoto(currentPhoto - 1);
    });

    nextButton.addEventListener('click', () => {
        showPhoto(currentPhoto + 1);
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
            showPhoto(currentPhoto - 1);
        }

        if (event.key === 'ArrowRight') {
            showPhoto(currentPhoto + 1);
        }

        if (event.key === 'Escape') {
            resetZoom();
        }
    });

    mainImage.addEventListener('click', (event) => {
        toggleZoom(event);
    });

    mainImage.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) {
            return;
        }

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;
    }, {
        passive: true
    });

    mainImage.addEventListener('touchend', (event) => {
        if (event.changedTouches.length !== 1) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const deltaX =
            touch.clientX - touchStartX;

        const deltaY =
            touch.clientY - touchStartY;

        if (Math.abs(deltaX) < 50) {
            return;
        }

        if (
            Math.abs(deltaX) >
            Math.abs(deltaY)
        ) {
            if (deltaX < 0) {
                showPhoto(currentPhoto + 1);
            } else {
                showPhoto(currentPhoto - 1);
            }
        }
    }, {
        passive: true
    });

    async function loadItem() {
        try {
            const catalogResponse =
                await fetch('catalog.json', {
                    cache: 'no-store'
                });

            const catalog =
                await catalogResponse.json();

            const folder =
                catalog[objectNumber];

            if (!folder) {
                throw new Error(
                    'Предмет не найден'
                );
            }

            const infoResponse =
                await fetch(
                    `objects/${encodeURIComponent(folder)}/info.json`,
                    { cache: 'no-store' }
                );

            if (!infoResponse.ok) {
                throw new Error(
                    'Не удалось загрузить info.json'
                );
            }

            const data =
                await infoResponse.json();

            titleElement.textContent =
                data.title || '';

            descriptionElement.textContent =
                data.description || '';

            /*
             * Возврат в категорию.
             *
             * Если у предмета есть подкатегория,
             * возвращаем именно в неё.
             * Если подкатегория отсутствует или равна "-",
             * возвращаем в категорию.
             */

            if (data.category) {
                let backUrl =
                    `category.html?category=${encodeURIComponent(data.category)}`;

                if (
                    data.subcategory &&
                    data.subcategory !== '-'
                ) {
                    backUrl +=
                        `&subcategory=${encodeURIComponent(data.subcategory)}`;
                }

                backLink.href = backUrl;
                backLink.textContent =
                    '← Категория';
            } else {
                backLink.href = 'index.html';
                backLink.textContent =
                    '← Каталог';
            }

            photos =
                await findPhotos(folder);

            if (photos.length) {
                gallery.classList.remove('hidden');

                showPhoto(0, false);

                updateArrows();
            }

            const expertiseFile =
                await findExpertise(folder);

            if (expertiseFile) {
                expertise.classList.remove('hidden');

                expertiseOpen.href =
                    expertiseFile;

                expertiseDownload.href =
                    expertiseFile;
            }

        } catch (error) {
            console.error(error);

            titleElement.textContent =
                'Предмет не найден';

            descriptionElement.textContent =
                '';
        }
    }

    loadItem();
</script>

</body>
</html>
